<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶龙吃蛋糕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1b1436;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #34255f 0%, #1b1436 70%);
  }
  #wrap {
    position: relative;
    flex-shrink: 0;   /* 禁止 flex 压缩画布（移动端适配由 JS 精确控制） */
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #0d0a1f;
    border-radius: 6px;
    box-shadow: 0 0 0 4px #4a3a86, 0 18px 50px rgba(0,0,0,.6);
    touch-action: none;
    background: #8fd3ff;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<script>
"use strict";
/* =====================================================================
   奶龙吃蛋糕 —— 横板单屏闯关（游戏集 · 第二个游戏）
   目标：操纵奶龙在平台间移动，吃到蛋糕后家才开放，回到家即通过。
   机关：固定平台 / 移动平台（到终点停 2 秒折返）/ 吊墙 / 深坑
   ===================================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = 960, H = 540;

/* ================= 物理常量 ================= */
const GRAVITY = 2200;
const MOVE_SPEED = 270;
const JUMP_V = -690;          // 跳跃高度 ≈ 108px（约为原高度一半），台阶纵向间距按 85px 设计留足余量
const FALL_LIMIT = 640;       // 掉出屏幕底部 → 重生

/* ================= 调色板 ================= */
const C = {
  grass: "#7cc353", grassD: "#55973a",
  dirt:  "#c98f4e", dirtD: "#a36d33",
  stone: "#9aa0a8", stoneD: "#6f7680",
  metal: "#b8c4d0", metalD: "#7d8a99",
  panel: "#241b47", panelE: "#ffd23f",
  btn:   "#ffd23f", btnD: "#c98a1e", btnText: "#3a2500"
};

/* ================= 奶龙像素精灵（16×16，复用自跑酷） ================= */
const NAILONG_PAL = {
  "#": "#8a4513", "y": "#ffc93c", "o": "#efa01e", "b": "#fff0c6",
  "w": "#ffffff", "g": "#4aa64f", "d": "#1c6b33", "k": "#161616",
  "p": "#96501f", "m": "#6e3a12"
};
const NAILONG_BODY = [
  ".......###......",
  ".....#yyyy#.....",
  "...#yyyyyyyy#...",
  "..#yyyyywwwww#..",
  ".#yyyyyywgwkwy#.",
  ".#yyyyyywggkwy#.",
  ".#yyyyyywgkkwy#.",
  ".#yyyyyywwwwwy#.",
  ".#yyyyyyyymmyy#.",
  "..##yyyyyyyyy#..",
  "#yyyyyybbbbb#yp.",
  "#yyyooybbbbbbb#..",
  ".ooyyybbbbbbby#..",
  ".#yyyyy..yyyy#..",
  "..#yyyy..yyyy#..",
  "...yppp..yppp..."
];
const NAILONG_RUNB = NAILONG_BODY.slice();
NAILONG_RUNB[14] = "....yyyyyyyy....";
NAILONG_RUNB[15] = ".....ypp.yppp...";
const NAILONG_JUMP = NAILONG_BODY.slice();
NAILONG_JUMP[8]  = "y#yyyyyyyymmyy#.";
NAILONG_JUMP[9]  = ".yyy#yyyyyyyyyp.";
NAILONG_JUMP[10] = "#yyyyyybbbbb#...";
NAILONG_JUMP[13] = "..#yyyyyyyy#....";
NAILONG_JUMP[14] = ".....yyyyyy.....";
NAILONG_JUMP[15] = "................";
const SPR = { runA: NAILONG_BODY, runB: NAILONG_RUNB, jump: NAILONG_JUMP };

/* ================= 蛋糕像素图（12×12，scale 4 = 48×48） ================= */
const CAKE_PAL = { "r": "#e33b4e", "w": "#fff6e8", "p": "#f2a7c3", "b": "#c99056" };
const CAKE_MAP = [
  ".....rr.....",
  "....rrrr....",
  "..wwwwwwww..",
  ".wwwwwwwwww.",
  "pppppppppppp",
  "pppppppppppp",
  "wwwwwwwwwwww",
  "wwwwwwwwwwww",
  "pppppppppppp",
  "pppppppppppp",
  "bbbbbbbbbbbb",
  "bbbbbbbbbbbb"
];
function drawSprite(map, ox, oy, scale, pal, flip) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r], n = row.length;
    for (let c = 0; c < n; c++) {
      const col = pal[row[flip ? n - 1 - c : c]];
      if (col) { ctx.fillStyle = col; ctx.fillRect((ox | 0) + c * scale, (oy | 0) + r * scale, scale, scale); }
    }
  }
}
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, Math.ceil(w), Math.ceil(h));
}
function pixelText(str, x, y, size, color, align = "left", shadow = true) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.textAlign = "left";
}

/* ================= 关卡数据（可扩展，后续关卡往数组里加） =================
   solids  ：四周实心（可顶头、不可穿越）
   oneways ：单向平台（从下往上可穿过，下落时站上）
   movers  ：移动平台（单向平台属性），到终点停 pause 秒后折返
   hazards ：危险物（碰到即重生，第一关暂无） */
const LEVELS = [
  {
    name: "奶油的醇厚",
    spawn: { x: 90, y: 470 },
    cake: { x: 150, y: 153 },          // 蛋糕中心（坐在蛋糕台顶面）
    home: { x: 640, y: 153 },          // 家的中心（坐在家平台顶面）
    solids: [
      { x: 0,   y: 470, w: 312, h: 70, kind: "ground" },   // 左下地面（延伸至电梯左缘）
      { x: 424, y: 470, w: 536, h: 70, kind: "ground" },   // 右下地面（延伸至电梯右缘）
      { x: 442, y: 0,   w: 58,  h: 376, kind: "wall" },    // 中央吊墙（上下必绕路）
      { x: -20, y: -60, w: 1000, h: 60, kind: "stone" },   // 顶棚
      { x: -20, y: 0,   w: 20,  h: 700, kind: "stone" },   // 左墙
      { x: 960, y: 0,   w: 20,  h: 700, kind: "stone" }    // 右墙
    ],
    oneways: [
      { x: 0,   y: 153, w: 295, h: 16, kind: "float" },    // 蛋糕台
      { x: 500, y: 153, w: 310, h: 16, kind: "float" },    // 家平台（右缘810与台阶三重叠，任意位置左跳均可上台）
      { x: 790, y: 385, w: 165, h: 16, kind: "float" },    // 右侧台阶一
      { x: 805, y: 300, w: 150, h: 16, kind: "float" },    // 右侧台阶二
      { x: 790, y: 215, w: 165, h: 16, kind: "float" }     // 右侧台阶三（左跳即到家平台）
    ],
    movers: [
      // 纵向电梯：底部地面 ↔ 蛋糕台高度（顶部与蛋糕台齐平，便于往返行走），到终点停 2 秒折返
      { x: 312, w: 112, yLow: 470, yHigh: 153, speed: 80, pause: 2 }
    ],
    hazards: []
  }
];

/* ================= 状态 ================= */
const ST = { MENU: 0, PLAY: 1, WIN: 2 };
let state = ST.MENU;
let levelIdx = 0;
let LV = null;                 // 当前关数据（含运行时的 mover 状态）
let cakeEaten = false;
let toast = "", toastT = 0;
let hintT = 0;                 // 操作提示显示时间
let winT = 0;                  // 结算面板延迟
let particles = [];
let camShake = 0;

const player = {
  x: 0, y: 0, w: 30, h: 44,
  vx: 0, vy: 0,
  grounded: false, stand: null,   // stand = 脚下的平台（移动平台携带用）
  face: 1, runT: 0, airT: 0,
  coyote: 0, jbuf: 0,
  respawnT: 0
};

let progress = +(localStorage.getItem("nailong_cake_progress") || 1);  // 已解锁关数

/* ================= 音效（WebAudio 方波） ================= */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(f0, f1, dur, vol = 0.06, type = "square") {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfxJump = () => beep(300, 620, 0.12);
const sfxEat  = () => { beep(660, 990, 0.1, 0.07); beep(990, 1320, 0.14, 0.06); };
const sfxWin  = () => { beep(523, 784, 0.14, 0.07); setTimeout(() => beep(659, 988, 0.14, 0.07), 120); setTimeout(() => beep(784, 1318, 0.24, 0.07), 240); };
const sfxFall = () => beep(360, 80, 0.3, 0.07, "sawtooth");
const sfxClick = () => beep(660, 880, 0.07, 0.05);

/* ================= 关卡装载 ================= */
function loadLevel(i) {
  levelIdx = i;
  const src = LEVELS[i];
  LV = {
    name: src.name, spawn: src.spawn, cake: src.cake, home: src.home,
    solids: src.solids, oneways: src.oneways, hazards: src.hazards,
    movers: src.movers.map(m => ({ ...m, y: m.yLow, dir: -1, pauseT: m.pause, dy: 0 }))  // 开局先在起点停 2 秒
  };
  cakeEaten = false;
  particles = [];
  toast = ""; toastT = 0;
  hintT = i === 0 ? 8 : 4.5;   // 第一关新手教程面板多展示一会
  winT = 0;
  respawnPlayer(true);
}
function respawnPlayer(fresh) {
  player.x = LV.spawn.x - player.w / 2;
  player.y = LV.spawn.y - player.h;
  player.vx = 0; player.vy = 0;
  player.grounded = true; player.stand = null;
  player.coyote = 0; player.jbuf = 0;
  player.respawnT = fresh ? 0 : 0.6;
}
function startLevel(i) { ensureAudio(); loadLevel(i); state = ST.PLAY; }

/* ================= 输入 ================= */
const keys = {};
addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowLeft", "ArrowRight", "ArrowDown"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  ensureAudio();
  if (state === ST.PLAY) {
    if (["Space", "ArrowUp", "KeyW"].includes(e.code)) player.jbuf = 0.12;
    if (e.code === "KeyR") { sfxClick(); loadLevel(levelIdx); }
    if (e.code === "Escape") { state = ST.MENU; }
  } else if (state === ST.MENU) {
    if (["Space", "Enter"].includes(e.code)) { sfxClick(); startLevel(Math.min(progress, LEVELS.length) - 1); }
  } else if (state === ST.WIN && winT > 0.4) {
    if (["Space", "Enter"].includes(e.code)) {
      sfxClick();
      if (levelIdx + 1 < LEVELS.length) startLevel(levelIdx + 1);
      else state = ST.MENU;
    }
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });

/* ---- 触屏：左半屏虚拟摇杆 + 右半屏跳跃 ---- */
const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const joy = { active: false, id: null, ax: 0, ay: 0, dx: 0, dy: 0, x: 0, y: 0 };   // ax/ay 锚点 dx/dy 偏移
const joyR = 46;
let jumpBtnHold = false;
const JUMP_BTN = { x: W - 84, y: H - 92, r: 52 };

function canvasPos(t) {
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  ensureAudio();
  for (const t of e.changedTouches) {
    const p = canvasPos(t);
    if (state === ST.PLAY) {
      if (hitR(p, HUB_BTN)) { location.href = "../index.html"; return; }
      if (p.x < W * 0.5 && !joy.active) {
        joy.active = true; joy.id = t.identifier;
        joy.ax = p.x; joy.ay = p.y; joy.dx = 0; joy.dy = 0;
      } else if (p.x >= W * 0.5) {
        jumpBtnHold = true;
        player.jbuf = 0.12;
      }
    } else {
      tapAt(p);
    }
  }
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      const p = canvasPos(t);
      joy.dx = p.x - joy.ax; joy.dy = p.y - joy.ay;
      const d = Math.hypot(joy.dx, joy.dy);
      if (d > joyR) { joy.dx *= joyR / d; joy.dy *= joyR / d; }
    }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) { joy.active = false; joy.dx = 0; joy.dy = 0; }
    else jumpBtnHold = false;
  }
}
canvas.addEventListener("touchend", endTouch, { passive: false });
canvas.addEventListener("touchcancel", endTouch, { passive: false });

/* ---- 鼠标（菜单/结算点击） ---- */
canvas.addEventListener("mousedown", e => {
  ensureAudio();
  if (state !== ST.PLAY) tapAt(canvasPos(e));
});
const HUB_BTN = { x: 12, y: 12, w: 88, h: 26, label: "← 游戏大厅" };
function hitR(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function tapAt(p) {
  if (state === ST.MENU) {
    // 关卡按钮
    for (const lb of levelButtons()) {
      if (hitR(p, lb)) {
        if (lb.unlocked) { sfxClick(); startLevel(lb.idx); }
        else sfxFall();
        return;
      }
    }
    if (hitR(p, HUB_BTN)) location.href = "../index.html";
  } else if (state === ST.WIN && winT > 0.4) {
    if (hitR(p, BTN_NEXT) && levelIdx + 1 < LEVELS.length) { sfxClick(); startLevel(levelIdx + 1); }
    else if (hitR(p, BTN_AGAIN)) { sfxClick(); startLevel(levelIdx); }
    else if (hitR(p, BTN_HUB2)) location.href = "../index.html";
  }
}
function levelButtons() {
  const out = [];
  const n = LEVELS.length;
  const bw = 300, bh = 44, x0 = (W - bw) / 2;
  for (let i = 0; i < n; i++) {
    out.push({ x: x0, y: 240 + i * (bh + 14), w: bw, h: bh, idx: i,
               unlocked: i < progress, label: LEVELS[i].name });
  }
  return out;
}
const BTN_NEXT  = { x: W / 2 - 250, y: 372, w: 150, h: 46 };
const BTN_AGAIN = { x: W / 2 - 75,  y: 372, w: 150, h: 46 };
const BTN_HUB2  = { x: W / 2 + 100, y: 372, w: 150, h: 46 };

/* ================= 移动平台 ================= */
function updateMovers(dt) {
  for (const m of LV.movers) {
    const prevY = m.y;
    m.py = m.y;                             // 上一帧位置（搭裁判定用）
    if (m.pauseT > 0) {
      m.pauseT -= dt;                       // 终点停留 2 秒
    } else {
      m.y += m.dir * m.speed * dt;
      if (m.y <= m.yHigh) { m.y = m.yHigh; m.dir = 1;  m.pauseT = m.pause; }
      if (m.y >= m.yLow)  { m.y = m.yLow;  m.dir = -1; m.pauseT = m.pause; }
    }
    m.dy = m.y - prevY;                     // 本帧位移（携带玩家）
  }
}

/* ================= 玩家物理 ================= */
function axisX() {
  let ax = 0;
  if (keys.ArrowLeft || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (joy.active) {
    const jx = joy.dx / joyR;
    if (Math.abs(jx) > 0.18) ax = Math.max(-1, Math.min(1, jx * 1.6));
  }
  return ax;
}
function updatePlayer(dt) {
  // 复生闪烁期间不可动
  if (player.respawnT > 0) { player.respawnT -= dt; return; }

  // 移动平台携带
  if (player.stand && player.stand.dy) player.y += player.stand.dy;

  const ax = axisX();
  player.vx = ax * MOVE_SPEED;
  if (ax !== 0) { player.face = ax > 0 ? 1 : -1; player.runT += dt; }

  // 土狼时间 + 跳跃缓冲
  player.coyote = player.grounded ? 0.08 : Math.max(0, player.coyote - dt);
  player.jbuf = Math.max(0, player.jbuf - dt);
  if (player.jbuf > 0 && player.coyote > 0) {
    player.vy = JUMP_V;
    player.grounded = false; player.stand = null; player.coyote = 0; player.jbuf = 0;
    sfxJump();
  }

  player.vy += GRAVITY * dt;
  if (player.vy > 900) player.vy = 900;

  /* ---- X 位移 + 实心碰撞 ---- */
  player.x += player.vx * dt;
  for (const s of LV.solids) {
    if (aabb(player, s)) {
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
    }
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  /* ---- Y 位移 ---- */
  const prevFeet = player.y + player.h;
  player.y += player.vy * dt;
  const feet = player.y + player.h;
  const prevStand = player.stand;   // 上一帧脚下的平台（下降平台吸附判定用）
  player.grounded = false;
  player.stand = null;

  // 实心：地面/顶头
  for (const s of LV.solids) {
    if (aabb(player, s)) {
      if (player.vy > 0) { player.y = s.y - player.h; land(s); }
      else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
    }
  }
  // 单向平台：仅下落时判定；脚在平台顶之上（或上一帧正站在此平台上）则落上
  if (player.vy >= 0) {
    const all = LV.oneways.concat(LV.movers);
    for (const p of all) {
      const topRef = p.py !== undefined ? Math.min(p.y, p.py) : p.y;
      if (player.x + player.w > p.x && player.x < p.x + p.w &&
          feet >= p.y && (prevFeet <= topRef + 1 || prevStand === p)) {
        player.y = p.y - player.h;
        land(p);
      }
    }
  }
  if (!player.grounded) player.airT += dt;
  else player.airT = 0;

  // 深坑坠落
  if (player.y > FALL_LIMIT) {
    sfxFall();
    respawnPlayer(false);
    showToast("摔下去了！回到出生点");
  }

  // 吃蛋糕
  if (!cakeEaten) {
    const ck = LV.cake;
    if (player.x + player.w > ck.x - 22 && player.x < ck.x + 22 &&
        player.y + player.h > ck.y - 44 && player.y < ck.y) {
      cakeEaten = true;
      sfxEat();
      showToast("蛋糕到手！快回家吧 →");
      for (let i = 0; i < 22; i++) {
        particles.push({
          x: ck.x + (Math.random() - 0.5) * 40, y: ck.y - 20,
          vx: (Math.random() - 0.5) * 160, vy: -60 - Math.random() * 140,
          life: 0.5 + Math.random() * 0.4, color: ["#f2a7c3", "#fff6e8", "#e33b4e"][i % 3], size: 3 + Math.random() * 3
        });
      }
    }
  }

  // 回家（吃到蛋糕后才开放）
  if (cakeEaten) {
    const hm = LV.home;
    if (player.x + player.w > hm.x - 26 && player.x < hm.x + 26 &&
        player.y + player.h > hm.y - 60 && player.y < hm.y) {
      state = ST.WIN; winT = 0;
      sfxWin();
      progress = Math.max(progress, Math.min(levelIdx + 2, LEVELS.length));
      localStorage.setItem("nailong_cake_progress", progress);
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: hm.x + (Math.random() - 0.5) * 120, y: hm.y - 60,
          vx: (Math.random() - 0.5) * 260, vy: -80 - Math.random() * 220,
          life: 0.8 + Math.random() * 0.8, color: ["#ffd23f", "#ff9aa9", "#7cc353", "#9fd8ff", "#fff"][i % 5], size: 3 + Math.random() * 4
        });
      }
    }
  }

  // 危险物（后续关卡扩展用）
  for (const hz of LV.hazards) {
    if (aabb(player, hz)) {
      sfxFall();
      respawnPlayer(false);
      showToast("碰到危险啦！回到出生点");
      break;
    }
  }
}
function land(p) {
  player.vy = 0;
  player.grounded = true;
  player.stand = p;
}
function aabb(a, b) {
  return a.x + a.w > b.x && a.x < b.x + b.w && a.y + a.h > b.y && a.y < b.y + b.h;
}
function showToast(s) { toast = s; toastT = 2.4; }

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function update(dt) {
  toastT = Math.max(0, toastT - dt);
  hintT = Math.max(0, hintT - dt);
  camShake = Math.max(0, camShake - dt * 3);
  // 粒子
  for (const p of particles) {
    p.life -= dt;
    p.vy += 700 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (state === ST.PLAY) {
    updateMovers(dt);
    updatePlayer(dt);
  } else if (state === ST.WIN) {
    winT += dt;
  }
}

/* ================= 绘制 ================= */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#6fc3ff");
  g.addColorStop(1, "#cdeeff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 远景云
  ctx.fillStyle = "rgba(255,255,255,.75)";
  const t = performance.now() / 1000;
  for (const [cx, cy, s] of [[120, 70, 1], [420, 46, 0.8], [720, 84, 1.15], [880, 40, 0.7]]) {
    const wob = Math.sin(t * 0.5 + cx) * 6;
    ctx.fillRect(cx + wob, cy, 70 * s, 18 * s);
    ctx.fillRect(cx + 16 * s + wob, cy - 12 * s, 44 * s, 14 * s);
  }
}
function drawSolid(s) {
  if (s.kind === "wall") {
    // 吊墙：石砖
    px(s.x, s.y, s.w, s.h, C.stone);
    px(s.x, s.y, 6, s.h, C.stoneD);
    px(s.x + s.w - 6, s.y, 6, s.h, C.stoneD);
    for (let by = 10; by < s.h; by += 26) {
      px(s.x + 6, s.y + by, s.w - 12, 3, C.stoneD);
      const off = (by / 26 | 0) % 2 ? 14 : 30;
      px(s.x + off, s.y + by - 26 < 0 ? s.y : s.y + by - 23, 3, 23, C.stoneD);
    }
    return;
  }
  // 地面/石块：泥土 + 草皮
  px(s.x, s.y, s.w, s.h, C.dirt);
  for (let dx = 0; dx < s.w; dx += 34) px(s.x + dx + 8, s.y + 22, 16, 6, C.dirtD);
  if (s.kind === "ground") {
    px(s.x, s.y, s.w, 12, C.grass);
    for (let dx = 0; dx < s.w; dx += 22) px(s.x + dx, s.y, 10, 5, C.grassD);
  } else {
    px(s.x, s.y, s.w, 6, C.stoneD);
  }
}
function drawOneway(p) {
  // 悬浮平台：草顶泥板
  px(p.x, p.y, p.w, p.h, C.dirt);
  px(p.x, p.y, p.w, 9, C.grass);
  for (let dx = 0; dx < p.w; dx += 22) px(p.x + dx, p.y, 10, 4, C.grassD);
  px(p.x, p.y + p.h - 3, p.w, 3, C.dirtD);
}
function drawMover(m) {
  // 电梯：金属板 + 黄黑警示条 + 上下箭头
  px(m.x, m.y, m.w, 16, C.metal);
  px(m.x, m.y, m.w, 4, "#dfe8f0");
  px(m.x, m.y + 12, m.w, 4, C.metalD);
  for (let dx = 4; dx < m.w - 8; dx += 18) px(m.x + dx, m.y + 4, 9, 8, "#ffd23f");
  // 中央箭头指示（呼吸闪烁）
  const a = Math.sin(performance.now() / 300) > 0 ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.45)";
  const cx = m.x + m.w / 2;
  px(cx - 3, m.y - 14, 6, 8, a);
  px(cx - 8, m.y - 8, 16, 3, a);
}
function drawCake() {
  if (cakeEaten) return;
  const ck = LV.cake;
  const bob = Math.sin(performance.now() / 300) * 3;
  // 光圈提示
  ctx.fillStyle = "rgba(255,210,63,.25)";
  ctx.beginPath(); ctx.arc(ck.x, ck.y - 24 + bob, 30, 0, 7); ctx.fill();
  drawSprite(CAKE_MAP, ck.x - 24, ck.y - 48 + bob, 4, CAKE_PAL, false);
}
function drawHome() {
  const hm = LV.home;
  const bx = hm.x - 50, by = hm.y;             // 房子左上基准（底部在地）
  // 墙体
  px(bx, by - 56, 100, 56, "#ffe9c0");
  px(bx, by - 56, 100, 4, "#d9b98a");
  px(bx, by - 4, 100, 4, "#c99056");
  // 屋顶（阶梯）
  px(bx - 8, by - 70, 116, 14, "#e05a4a");
  px(bx + 4, by - 82, 92, 12, "#e05a4a");
  px(bx + 18, by - 92, 64, 10, "#c94438");
  px(bx - 8, by - 70, 116, 3, "#a83228");
  // 窗户
  px(bx + 10, by - 44, 16, 14, "#9fd8ff");
  px(bx + 10, by - 44, 16, 3, "#5a86b0");
  px(bx + 74, by - 44, 16, 14, "#9fd8ff");
  px(bx + 74, by - 44, 16, 3, "#5a86b0");
  // 门（吃到蛋糕才开放）
  const doorX = hm.x - 13, doorY = by - 34;
  if (cakeEaten) {
    const glow = Math.sin(performance.now() / 200) > 0;
    if (glow) { ctx.fillStyle = "rgba(255,210,63,.3)"; ctx.beginPath(); ctx.arc(hm.x, doorY + 18, 30, 0, 7); ctx.fill(); }
    px(doorX, doorY, 26, 34, glow ? "#ffd23f" : "#f0b428");
    px(doorX + 3, doorY + 3, 20, 31, "#7a4a00");
    px(doorX + 6, doorY + 6, 14, 12, "#ffd23f");
    // 弹跳箭头
    const ay = by - 108 + Math.sin(performance.now() / 180) * 6;
    px(hm.x - 7, ay + 8, 14, 6, "#3a2500");
    px(hm.x - 3, ay, 6, 8, "#3a2500");
    pixelText("家", hm.x, by - 66, 12, "#fff", "center");
  } else {
    px(doorX, doorY, 26, 34, "#5a4632");
    px(doorX + 3, doorY + 3, 20, 31, "#3a2c1c");
    // 锁
    px(doorX + 8, doorY + 12, 10, 8, "#9aa0a8");
    px(doorX + 10, doorY + 7, 6, 6, "#9aa0a8");
    px(doorX + 12, doorY + 15, 2, 4, "#3a2c1c");
    pixelText("未开放", hm.x, by - 66, 11, "rgba(60,40,20,.8)", "center");
  }
}
function drawPlayer() {
  if (player.respawnT > 0) {
    if (Math.floor(performance.now() / 90) % 2 === 0) return;   // 复生闪烁
  }
  let map = SPR.runA;
  if (!player.grounded) map = SPR.jump;
  else if (Math.abs(player.vx) > 10 && Math.floor(player.runT / 0.14) % 2 === 1) map = SPR.runB;
  const sx = player.x + player.w / 2 - 24;
  const sy = player.y + player.h - 50 + 2;
  // 影子
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.ellipse(player.x + player.w / 2, player.y + player.h + 2, 16, 4, 0, 0, 7);
  ctx.fill();
  drawSprite(map, sx, sy, 3, NAILONG_PAL, player.face < 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    px(p.x, p.y, p.size, p.size, p.color);
  }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  // 顶部信息
  pixelText(LV.name, W / 2, 14, 15, "#fff", "center");
  // 蛋糕/家 状态指示
  pixelText(cakeEaten ? "🍰 已到手 → 🏠 快回家！" : "🍰 先吃蛋糕，🏠 才会开门", W / 2, 36, 12, "#fff", "center");
  // 复活提示
  if (toastT > 0) pixelText(toast, W / 2, 60, 13, "#ffe873", "center");
  // 操作提示（第一关由新手教程系统接管，不在底部重复显示）
  if (hintT > 0 && state === ST.PLAY && levelIdx !== 0) {
    ctx.globalAlpha = Math.min(1, hintT);
    pixelText(IS_TOUCH ? "左半屏拖动 = 移动 · 右半屏点按 = 跳跃" : "←→/AD 移动 · 空格/↑ 跳跃 · R 重开本关",
              W / 2, H - 26, 12, "#fff", "center");
    ctx.globalAlpha = 1;
  }
}
/* ================= 新手教程（仅第一关） ================= */
function drawBubble(lines, cx, cy) {
  const lh = 18, padX = 12, padY = 8;
  ctx.font = 'bold 13px "Courier New", monospace';
  let w = 0;
  for (const s of lines) w = Math.max(w, ctx.measureText(s).width);
  w = Math.ceil(w) + padX * 2;
  const h = lines.length * lh + padY * 2 - 4;
  const x = Math.max(6, Math.min(W - w - 6, cx - w / 2));
  const y = Math.max(52, Math.min(H - h - 6, cy));
  ctx.fillStyle = "rgba(20,12,45,.82)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,210,63,.85)"; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  lines.forEach((s, i) => pixelText(s, x + w / 2, y + padY + i * lh, 13, "#fff", "center", false));
}
function drawTutorial() {
  if (levelIdx !== 0 || state !== ST.PLAY) return;
  // 开局规则面板：操作 + 游戏规则
  if (hintT > 0) {
    const bw = 470, bh = 128, x0 = (W - bw) / 2, y0 = 74;
    ctx.globalAlpha = Math.min(1, hintT / 1.5);
    px(x0 + 4, y0 + 4, bw, bh, "rgba(0,0,0,.35)");
    px(x0, y0, bw, bh, "rgba(20,12,45,.9)");
    px(x0, y0, bw, 4, C.panelE); px(x0, y0 + bh - 4, bw, 4, C.panelE);
    pixelText("🎮 新手教程", W / 2, y0 + 12, 20, "#ffd23f", "center", false);
    pixelText(IS_TOUCH ? "移动：按住左半屏拖动 · 跳跃：点右侧「跳」键" : "移动：← → / A D · 跳跃：空格 / ↑",
              W / 2, y0 + 48, 14, "#fff", "center", false);
    pixelText("规则：吃到蛋糕 → 家门打开 → 回家即过关", W / 2, y0 + 74, 14, "#cfe8ff", "center", false);
    pixelText("小心别摔出画面，摔下去会回到出生点", W / 2, y0 + 98, 12, "#9fd8ff", "center", false);
    ctx.globalAlpha = 1;
  }
  // 情境提示气泡：跟着玩家进度走
  const feet = player.y + player.h;
  const m = LV.movers[0];
  const onMover = player.stand === m;
  let lines = null, cx = 0, cy = 0;
  if (!cakeEaten) {
    if (feet > 460 && player.x < 280 && !onMover) {
      lines = ["移动：" + (IS_TOUCH ? "左半屏摇杆" : "← → / A D"), "走向右边的电梯 →"]; cx = 150; cy = 350;
    } else if (feet > 460 && player.x < 442 && !onMover) {
      lines = ["站上去，电梯会载你上高处"]; cx = 368; cy = 400;
    } else if (onMover && feet > 170) {
      lines = ["电梯上升中…"]; cx = 368; cy = Math.min(feet - 90, 430);
    } else if (feet <= 170) {
      lines = ["向左走，吃掉蛋糕 🍰"]; cx = 150; cy = 210;
    }
  } else {
    if (feet <= 170 || (onMover && m.y < 460)) {
      lines = ["蛋糕到手！乘电梯下去 →"]; cx = 368; cy = 230;
    } else if (feet > 460 && player.x < 700) {
      lines = ["向右走到底"]; cx = 620; cy = 390;
    } else if (feet > 460) {
      lines = ["跳跃：" + (IS_TOUCH ? "点右侧「跳」键" : "空格 / ↑"), "连跳三层台阶上去"]; cx = 800; cy = 320;
    } else {
      lines = ["继续上跳，再向左回家 🏠"]; cx = 700; cy = 250;
    }
  }
  if (lines) drawBubble(lines, cx, cy);
}
function drawTouchControls() {
  if (!IS_TOUCH) return;
  // 摇杆
  if (joy.active) {
    ctx.fillStyle = "rgba(20,12,45,.3)";
    ctx.beginPath(); ctx.arc(joy.ax, joy.ay, joyR, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ax, joy.ay, joyR, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,210,63,.85)";
    ctx.beginPath(); ctx.arc(joy.ax + joy.dx, joy.ay + joy.dy, 20, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(20,12,45,.22)";
    ctx.beginPath(); ctx.arc(86, H - 92, joyR, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(86, H - 92, joyR, 0, 7); ctx.stroke();
    pixelText("移\n动", 86 - 10, H - 104, 14, "rgba(255,255,255,.6)");
  }
  // 跳跃按钮
  const glow = jumpBtnHold;
  ctx.fillStyle = glow ? "rgba(255,210,63,.6)" : "rgba(20,12,45,.3)";
  ctx.beginPath(); ctx.arc(JUMP_BTN.x, JUMP_BTN.y, JUMP_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = glow ? "#ffd23f" : "rgba(255,255,255,.5)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(JUMP_BTN.x, JUMP_BTN.y, JUMP_BTN.r, 0, 7); ctx.stroke();
  pixelText("跳", JUMP_BTN.x - 14, JUMP_BTN.y - 14, 24, "#fff");
}
function drawButton(b, hover) {
  const c = hover ? "#ffe278" : C.btn;
  px(b.x + 3, b.y + 3, b.w, b.h, "rgba(0,0,0,.35)");
  px(b.x, b.y, b.w, b.h, c);
  px(b.x, b.y, b.w, 4, "#fff3c0");
  px(b.x, b.y + b.h - 4, b.w, 4, C.btnD);
  pixelText(b.label, b.x + b.w / 2, b.y + (b.h - 14) / 2, 15, C.btnText, "center", false);
}
function drawHubButton() {
  px(HUB_BTN.x, HUB_BTN.y, HUB_BTN.w, HUB_BTN.h, "rgba(20,12,45,.55)");
  px(HUB_BTN.x, HUB_BTN.y, HUB_BTN.w, 3, "rgba(255,255,255,.4)");
  pixelText(HUB_BTN.label, HUB_BTN.x + HUB_BTN.w / 2, HUB_BTN.y + 6, 13, "#fff", "center", false);
}
function render() {
  drawBackground();
  if (!LV) { drawMenu(); return; }

  // 场景
  for (const s of LV.solids) drawSolid(s);
  for (const p of LV.oneways) drawOneway(p);
  for (const m of LV.movers) drawMover(m);
  drawHome();
  drawCake();
  drawParticles();
  if (state !== ST.MENU) drawPlayer();

  if (state === ST.PLAY) {
    drawHUD();
    drawTutorial();
    drawHubButton();
    drawTouchControls();
  } else if (state === ST.MENU) {
    drawMenu();
  } else if (state === ST.WIN) {
    drawHUD();
    if (winT > 0.4) drawWinPanel();
  }
}
function drawMenu() {
  ctx.fillStyle = "rgba(20,12,45,.42)";
  ctx.fillRect(0, 0, W, H);
  if (LV) {   // 场景作为背景
    for (const s of LV.solids) drawSolid(s);
    for (const p of LV.oneways) drawOneway(p);
    for (const m of LV.movers) drawMover(m);
    drawHome(); drawCake();
    ctx.fillStyle = "rgba(20,12,45,.55)";
    ctx.fillRect(0, 0, W, H);
  }
  // 奶龙立绘
  drawSprite(SPR.runA, W / 2 - 36, 96, 4.5, NAILONG_PAL, false);
  // 蛋糕点缀
  drawSprite(CAKE_MAP, W / 2 + 52, 130, 3, CAKE_PAL, false);

  const ty = 34 + Math.round(Math.sin(performance.now() / 400) * 2);
  pixelText("奶龙吃蛋糕", W / 2 + 3, ty + 3, 44, "rgba(0,0,0,.45)", "center", false);
  pixelText("奶龙吃蛋糕", W / 2, ty, 44, "#ffd23f", "center", false);
  pixelText("吃到蛋糕 · 平台间跳跃 · 安全回家", W / 2, 186, 15, "#cfe8ff", "center");

  for (const lb of levelButtons()) {
    drawButton(lb, false);
    if (!lb.unlocked) {
      ctx.fillStyle = "rgba(20,12,45,.6)";
      ctx.fillRect(lb.x, lb.y, lb.w, lb.h);
      pixelText(lb.label + " 🔒", lb.x + lb.w / 2, lb.y + 14, 15, "#8f86b8", "center", false);
    }
  }
  drawHubButton();
  if (!IS_TOUCH) pixelText("点击关卡开始 · 空格快速开始", W / 2, 400, 12, "#fff", "center");
}
function drawWinPanel() {
  ctx.fillStyle = "rgba(10,6,28,.6)";
  ctx.fillRect(0, 0, W, H);
  const pw = 520, ph = 240, x0 = (W - pw) / 2, y0 = (H - ph) / 2 - 20;
  px(x0 + 5, y0 + 5, pw, ph, "rgba(0,0,0,.4)");
  px(x0, y0, pw, ph, C.panel);
  px(x0, y0, pw, 5, C.panelE);
  px(x0, y0 + ph - 5, pw, 5, C.panelE);
  px(x0, y0, 5, ph, C.panelE);
  px(x0 + pw - 5, y0, 5, ph, C.panelE);

  pixelText("通过！", W / 2, y0 + 26, 40, "#ffd23f", "center", false);
  pixelText("奶龙吃到了蛋糕，安全到家啦！", W / 2, y0 + 82, 15, "#cfe8ff", "center");
  pixelText(`本关：${LV.name}`, W / 2, y0 + 108, 13, "#9fd8ff", "center");

  // 按钮
  const hasNext = levelIdx + 1 < LEVELS.length;
  // 下一关
  px(BTN_NEXT.x + 3, BTN_NEXT.y + 3, BTN_NEXT.w, BTN_NEXT.h, "rgba(0,0,0,.35)");
  px(BTN_NEXT.x, BTN_NEXT.y, BTN_NEXT.w, BTN_NEXT.h, hasNext ? C.btn : "#554a7a");
  pixelText(hasNext ? "下一关" : "敬请期待", BTN_NEXT.x + BTN_NEXT.w / 2, BTN_NEXT.y + 15, 15, hasNext ? C.btnText : "#a89cc8", "center", false);
  // 再玩一次
  px(BTN_AGAIN.x + 3, BTN_AGAIN.y + 3, BTN_AGAIN.w, BTN_AGAIN.h, "rgba(0,0,0,.35)");
  px(BTN_AGAIN.x, BTN_AGAIN.y, BTN_AGAIN.w, BTN_AGAIN.h, "#9fd8ff");
  pixelText("再玩一次", BTN_AGAIN.x + BTN_AGAIN.w / 2, BTN_AGAIN.y + 15, 15, "#0e2a4a", "center", false);
  // 返回大厅
  px(BTN_HUB2.x + 3, BTN_HUB2.y + 3, BTN_HUB2.w, BTN_HUB2.h, "rgba(0,0,0,.35)");
  px(BTN_HUB2.x, BTN_HUB2.y, BTN_HUB2.w, BTN_HUB2.h, "#ff9aa9");
  pixelText("返回大厅", BTN_HUB2.x + BTN_HUB2.w / 2, BTN_HUB2.y + 15, 15, "#5a1020", "center", false);
}

/* ================= 移动端画布适配（与跑酷同方案） ================= */
function fitWrap() {
  const wrap = document.getElementById("wrap");
  const vw = innerWidth, vh = innerHeight;
  const scale = Math.min(vw * 0.98 / W, vh * 0.94 / H);
  wrap.style.width = Math.floor(W * scale) + "px";
}
addEventListener("resize", fitWrap);
addEventListener("orientationchange", fitWrap);
fitWrap();

/* ================= 启动 ================= */
loadLevel(0);          // 菜单背后先摆好第一关场景
requestAnimationFrame(frame);
</script>
