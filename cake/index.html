function drawSprite(map, ox, oy, scale, pal, flip) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r], n = row.length;
    for (let c = 0; c < n; c++) {
      const col = pal[row[flip ? n - 1 - c : c]];
      if (col) { ctx.fillStyle = col; ctx.fillRect((ox | 0) + c * scale, (oy | 0) + r * scale, scale, scale); }
    }
  }
}
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, Math.ceil(w), Math.ceil(h));
}
function pixelText(str, x, y, size, color, align = "left", shadow = true) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.textAlign = "left";
}

/* ================= 音效（WebAudio 方波） ================= */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(f0, f1, dur, vol = 0.06, type = "square") {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

/* ---- 触屏：左半屏虚拟摇杆 + 右半屏跳跃 ---- */
const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const joy = { active: false, id: null, ax: 0, ay: 0, dx: 0, dy: 0, x: 0, y: 0 };   // ax/ay 锚点 dx/dy 偏移
const joyR = IS_TOUCH ? 62 : 46;                    // 触屏放大摇杆半径，手指更好推
let jumpBtnHold = false;
const JUMP_BTN = IS_TOUCH ? { x: W - 96, y: H - 106, r: 66 } : { x: W - 84, y: H - 92, r: 52 };
const JOY_IDLE = IS_TOUCH ? { x: 100, y: H - 110 } : { x: 86, y: H - 92 };   // 未按下时的摇杆提示位置

function canvasPos(t) {
  const r = canvas.getBoundingClientRect();
  const cx = t.clientX, cy = t.clientY;
  if (wrapRotated) {
    // 竖屏下 #wrap 被 JS 旋转 90°：屏幕 x/y 与画布坐标互换
    return {
      x: W / 2 + (cy - (r.top + r.height / 2)) * W / r.height,
      y: H / 2 - (cx - (r.left + r.width / 2)) * H / r.width
    };
  }
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  ensureAudio();
  for (const t of e.changedTouches) {
    const p = canvasPos(t);
    if (state === ST.PLAY) {
      if (hitR(p, HUB_BTN)) { location.href = "../index.html"; return; }
      if (p.x < W * 0.5 && !joy.active) {
        joy.active = true; joy.id = t.identifier;
        joy.ax = p.x; joy.ay = p.y; joy.dx = 0; joy.dy = 0;
      } else if (p.x >= W * 0.5) {
        jumpBtnHold = true;
        player.jbuf = 0.12;
      }
    } else {
      tapAt(p);
    }
  }
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      const p = canvasPos(t);
      joy.dx = p.x - joy.ax; joy.dy = p.y - joy.ay;
      const d = Math.hypot(joy.dx, joy.dy);
      if (d > joyR) { joy.dx *= joyR / d; joy.dy *= joyR / d; }
    }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) { joy.active = false; joy.dx = 0; joy.dy = 0; }
    else jumpBtnHold = false;
  }
}

/* ---- 选关界面：关卡卡片（三列网格，九关刚好排满一屏） ---- */
function levelCards() {
  const out = [];
  const n = LEVELS.length;
  const cols = 3, cw = 290, ch = 100, gx = 15, gy = 18;
  const x0 = (W - (cols * cw + (cols - 1) * gx)) / 2, y0 = 140;
  // 当前关数据里出现过的机关种类，作为卡片标签
  function tagsOf(L) {
    const t = [];
    // 新机关优先展示，最多 3 个标签
    if (L.portals && L.portals.length) t.push("传送门");
    if (L.bugs && L.bugs.length) t.push("刺虫");
    if (L.movers && L.movers.length) t.push("移动平台");
    if (L.frags && L.frags.length) t.push("易碎平台");
    if (L.orbs && L.orbs.length) t.push("跳跃能量");
    if (L.pit) t.push("深渊");
    return t.slice(0, 3);
  }
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    out.push({
      x: x0 + c * (cw + gx), y: y0 + r * (ch + gy), w: cw, h: ch,
      idx: i, cleared: i < progress - 1, label: LEVELS[i].name, tags: tagsOf(LEVELS[i])
    });
  }
  return out;
}

/* ================= 移动平台 ================= */
function updateMovers(dt) {
  for (const m of LV.movers) {
    const prevY = m.y;
    m.py = m.y;                             // 上一帧位置（搭裁判定用）
    // 易碎计时（含碎裂后的修复倒计时）必须放在 broken 判断之前，
    // 否则 continue 会跳过 tickFragile，碎裂的平台永远等不到修复
    if (m.fragile && tickFragile(m, dt)) shatterFrag(m);
    if (m.broken) { m.dy = 0; continue; }   // 碎裂中：停在原地（相位保留），修复后继续往返
    if (m.pauseT > 0) {
      m.pauseT -= dt;                       // 终点停留 2 秒
    } else {
      m.y += m.dir * m.speed * dt;
      if (m.y <= m.yHigh) { m.y = m.yHigh; m.dir = 1;  m.pauseT = m.pause; }
      if (m.y >= m.yLow)  { m.y = m.yLow;  m.dir = -1; m.pauseT = m.pause; }
    }
    m.dy = m.y - prevY;                     // 本帧位移（携带玩家）
  }
}

/* ========= 易碎平台（可单独存在，也可挂在移动平台上） ========= */
/* 踩过一次就开始倒计时（不需要一直站在上面），1 秒后碎裂，4 秒后修复；返回 true 表示本帧刚碎 */
function tickFragile(o, dt) {
  if (o.broken) {
    o.rt -= dt;
    if (o.rt <= 0) { o.broken = false; o.rt = 0; o.t = 0; o.armed = false; }   // 4 秒后修复
    return false;
  }
  if (!o.armed && player.stand === o) o.armed = true;
  if (o.armed) {
    o.t += dt;
    if (o.t >= FRAG_BREAK_T) { o.broken = true; o.rt = FRAG_REPAIR_T; o.t = 0; return true; }
  }
  return false;
}
/* 碎裂瞬间：音效 + 碎块粒子 + 把还站在上面的玩家放下 */
function shatterFrag(o) {
  sfxFrag(); camShake = 0.4;
  if (player.stand === o) { player.stand = null; player.grounded = false; }
  for (let i = 0; i < 14; i++) {
    particles.push({
      x: o.x + Math.random() * o.w, y: o.y + 8,
      vx: (Math.random() - 0.5) * 90, vy: 40 + Math.random() * 120,
      life: 0.6 + Math.random() * 0.5, color: ["#cf9550", "#e0ac6a", "#a9693a"][i % 3], size: 3 + Math.random() * 4
    });
  }
}
function updateFrags(dt) {
  for (const f of LV.frags) if (tickFragile(f, dt)) shatterFrag(f);
}

/* ================= 刺虫（在固定区间来回巡逻，碰到回出生点） ================= */
function updateBugs(dt) {
  for (const b of LV.bugs) {
    b.x += b.dir * b.speed * dt;
    if (b.x <= b.x1) { b.x = b.x1; b.dir = 1; }
    if (b.x + b.w >= b.x2) { b.x = b.x2 - b.w; b.dir = -1; }
  }
}
function bugBox(b) {
  return { x: b.x + 2, y: b.y - b.h, w: b.w - 4, h: b.h };   // 碰撞盒比贴图略收窄
}

/* ================= 传送门（场景中偶数个，相邻两个成对） ================= */
function portalBox(p) {
  return { x: p.x - 13, y: p.y - 46, w: 26, h: 46 };          // 竖立的椭圆形门
}
function updatePortals() {
  if (player.respawnT > 0) return;
  // 走出出口门的范围后解除锁定，避免在门里来回弹
  if (player.portalLock && !aabb(player, portalBox(player.portalLock))) player.portalLock = null;
  for (let i = 0; i < LV.portals.length; i++) {
    const p = LV.portals[i];
    if (p === player.portalLock) continue;
    if (aabb(player, portalBox(p))) {
      // 标了 need:"cake" 的门要吃到蛋糕后才激活
      if (p.need === "cake" && !cakeEaten) {
        if (toastT <= 0) showToast("这扇传送门还暗着，先去吃蛋糕！", 1.8);
        continue;
      }
      const q = LV.portals[i % 2 === 0 ? i + 1 : i - 1];     // 0↔1、2↔3
      player.x = q.x - player.w / 2;
      player.y = q.y - player.h;
      player.vx = 0; player.vy = 0;
      player.stand = null;
      player.portalLock = q;                                  // 从 q 出来，先锁住 q
      sfxWarp();
      const PORTAL_COLORS = ["#9fd8ff", "#d9a6ff"];
      const wcol = PORTAL_COLORS[Math.floor(i / 2) % PORTAL_COLORS.length];
      for (const [px0, py0] of [[p.x, p.y], [q.x, q.y]]) {
        for (let k = 0; k < 14; k++) {
          particles.push({
            x: px0 + (Math.random() - 0.5) * 24, y: py0 - 24 + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
            life: 0.3 + Math.random() * 0.3, color: wcol, size: 3 + Math.random() * 3
          });
        }

      break;
    }
  }
}

/* ================= 跳跃能量 ================= */
function updateOrbs(dt) {

    if (o.taken) continue;                        // 已被拾取：等玩家落地后自动恢复
    if (aabb(player, { x: o.x - 11, y: o.y - 11, w: 22, h: 22 })) {

        });
      }

  }
}

/* ================= 玩家物理 ================= */
function axisX() {
  let ax = 0;
  if (keys.ArrowLeft || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (joy.active) {
    const jx = joy.dx / joyR;
    if (Math.abs(jx) > 0.18) ax = Math.max(-1, Math.min(1, jx * 1.6));
  }
  return ax;
}
function updatePlayer(dt) {
  // 复生闪烁期间不可动
  if (player.respawnT > 0) { player.respawnT -= dt; return; }

  // 移动平台携带
  if (player.stand && player.stand.dy) player.y += player.stand.dy;

  const ax = axisX();
  player.vx = ax * (player.grounded ? MOVE_SPEED : AIR_MOVE_SPEED);   // 空中横向速度降低 30%
  if (ax !== 0) { player.face = ax > 0 ? 1 : -1; player.runT += dt; }

  // 土狼时间 + 跳跃缓冲
  player.coyote = player.grounded ? 0.08 : Math.max(0, player.coyote - dt);
  player.jbuf = Math.max(0, player.jbuf - dt);
  if (player.jbuf > 0 && player.coyote > 0) {
    player.vy = JUMP_V;
    player.grounded = false; player.stand = null; player.coyote = 0; player.jbuf = 0;
    sfxJump();
  } else if (player.jbuf > 0 && player.airJump > 0 && !player.grounded) {
    // 空中二段跳：消耗拾取到的跳跃能量（略高于地面跳，给足容错）
    player.vy = AIR_JUMP_V;
    player.airJump--; player.jbuf = 0; player.stand = null;
    sfxOrb();
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: player.x + player.w / 2 + (Math.random() - 0.5) * 26, y: player.y + player.h - 6,
        vx: (Math.random() - 0.5) * 180, vy: 30 + Math.random() * 90,
        life: 0.35 + Math.random() * 0.3, color: ["#ffd23f", "#fff6e8", "#9fd8ff"][i % 3], size: 3 + Math.random() * 3
      });
    }
  }

  player.vy += GRAVITY * dt;
  if (player.vy > 900) player.vy = 900;

  /* ---- X 位移 + 实心碰撞 ---- */
  player.x += player.vx * dt;
  for (const s of LV.solids) {
    if (aabb(player, s)) {
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
    }
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  /* ---- Y 位移 ---- */
  const prevFeet = player.y + player.h;
  player.y += player.vy * dt;
  const feet = player.y + player.h;
  const prevStand = player.stand;   // 上一帧脚下的平台（下降平台吸附判定用）
  player.grounded = false;
  player.stand = null;

  // 实心：地面/顶头
  for (const s of LV.solids) {
    if (aabb(player, s)) {
      if (player.vy > 0) { player.y = s.y - player.h; land(s); }
      else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
    }
  }
  // 单向平台：仅下落时判定；脚在平台顶之上（或上一帧正站在此平台上）则落上
  if (player.vy >= 0) {
    const all = LV.oneways.concat(LV.movers.filter(m => !m.broken), LV.frags.filter(f => !f.broken));
    for (const p of all) {
      const topRef = p.py !== undefined ? Math.min(p.y, p.py) : p.y;
      if (player.x + player.w > p.x && player.x < p.x + p.w &&
          feet >= p.y && (prevFeet <= topRef + 1 || prevStand === p)) {
        player.y = p.y - player.h;
        land(p);
      }
    }
  }
  if (!player.grounded) player.airT += dt;
  else player.airT = 0;

  // 深坑坠落
  if (player.y > FALL_LIMIT) {
    sfxFall();
    respawnPlayer(false);
    showToast("摔下去了！回到出生点");
  }

  // 吃蛋糕
  if (!cakeEaten) {
    const ck = LV.cake;
    if (player.x + player.w > ck.x - 22 && player.x < ck.x + 22 &&
        player.y + player.h > ck.y - 44 && player.y < ck.y) {
      cakeEaten = true;
      sfxEat();
      showToast("蛋糕到手！快回家吧 →");
      for (let i = 0; i < 22; i++) {
        particles.push({
          x: ck.x + (Math.random() - 0.5) * 40, y: ck.y - 20,
          vx: (Math.random() - 0.5) * 160, vy: -60 - Math.random() * 140,
          life: 0.5 + Math.random() * 0.4, color: ["#f2a7c3", "#fff6e8", "#e33b4e"][i % 3], size: 3 + Math.random() * 3
        });
      }
    }
  }

  // 回家（吃到蛋糕后才开放）
  if (cakeEaten) {
    const hm = LV.home;
    if (player.x + player.w > hm.x - 26 && player.x < hm.x + 26 &&
        player.y + player.h > hm.y - 60 && player.y < hm.y) {
      state = ST.WIN; winT = 0;
      playLaugh();
      // 过关奖励：首次通过第 3/6/9 关解锁对应形象（结算面板弹提示）
      for (const id of SKIN_ORDER) {
        if (SKINS[id].need === levelIdx + 1 && progress - 1 < SKINS[id].need) newUnlock = id;
      }
      // 上限放宽到 关数+1：通关最后一关后 progress-1 才能正确等于已通关数（解锁判定/选关勾选都靠它）
      progress = Math.max(progress, Math.min(levelIdx + 2, LEVELS.length + 1));
      localStorage.setItem("nailong_cake_progress", progress);
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: hm.x + (Math.random() - 0.5) * 120, y: hm.y - 60,
          vx: (Math.random() - 0.5) * 260, vy: -80 - Math.random() * 220,
          life: 0.8 + Math.random() * 0.8, color: ["#ffd23f", "#ff9aa9", "#7cc353", "#9fd8ff", "#fff"][i % 5], size: 3 + Math.random() * 4
        });
      }
    }
  }

  // 危险物（后续关卡扩展用）
  for (const hz of LV.hazards) {
    if (aabb(player, hz)) {
      sfxFall();
      respawnPlayer(false);
      showToast("碰到危险啦！回到出生点");
      return;
    }
  }
  // 刺虫：来回巡逻，碰到回出生点
  for (const b of LV.bugs) {
    if (aabb(player, bugBox(b))) {
      sfxFall();
      respawnPlayer(false);
      showToast("被刺虫扎到啦！回到出生点");
      return;
    }
  }
}
function land(p) {
  player.vy = 0;
  player.grounded = true;
  player.stand = p;
  player.airJump = 0;                            // 落到平台后跳跃能量清零
  for (const o of LV.orbs) o.taken = false;      // 落地立即恢复跳跃能量球（无需等待充能）
}
function aabb(a, b) {
  return a.x + a.w > b.x && a.x < b.x + b.w && a.y + a.h > b.y && a.y < b.y + b.h;
}
function showToast(s, d = 2.4) { toast = s; toastT = d; }

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function update(dt) {
  toastT = Math.max(0, toastT - dt);
  hintT = Math.max(0, hintT - dt);
  camShake = Math.max(0, camShake - dt * 3);
  // 粒子
  for (const p of particles) {
    p.life -= dt;
    p.vy += 700 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (state === ST.PLAY) {
    updateMovers(dt);
    updateFrags(dt);
    updateBugs(dt);
    updatePlayer(dt);
    updateOrbs(dt);
    updatePortals();
  } else if (state === ST.WIN) {
    winT += dt;
  }
}

/* ================= 绘制 ================= */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#6fc3ff");
  g.addColorStop(1, "#cdeeff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 远景云
  ctx.fillStyle = "rgba(255,255,255,.75)";
  const t = performance.now() / 1000;
  for (const [cx, cy, s] of [[120, 70, 1], [420, 46, 0.8], [720, 84, 1.15], [880, 40, 0.7]]) {
    const wob = Math.sin(t * 0.5 + cx) * 6;
    ctx.fillRect(cx + wob, cy, 70 * s, 18 * s);
    ctx.fillRect(cx + 16 * s + wob, cy - 12 * s, 44 * s, 14 * s);
  }
}
function drawSolid(s) {
  if (s.kind === "wall") {
    // 吊墙：石砖
    px(s.x, s.y, s.w, s.h, C.stone);
    px(s.x, s.y, 6, s.h, C.stoneD);
    px(s.x + s.w - 6, s.y, 6, s.h, C.stoneD);
    for (let by = 10; by < s.h; by += 26) {
      px(s.x + 6, s.y + by, s.w - 12, 3, C.stoneD);
      const off = (by / 26 | 0) % 2 ? 14 : 30;
      px(s.x + off, s.y + by - 26 < 0 ? s.y : s.y + by - 23, 3, 23, C.stoneD);
    }
    return;
  }
  // 地面/石块：泥土 + 草皮
  px(s.x, s.y, s.w, s.h, C.dirt);
  // 装饰条纹一律按平台右边界截断，避免超出平台范围画到相邻区域
  for (let dx = 0; dx < s.w; dx += 34) {
    const tx = s.x + dx + 8, tw = Math.min(16, s.x + s.w - tx);
    if (tw > 0) px(tx, s.y + 22, tw, 6, C.dirtD);
  }
  if (s.kind === "ground") {
    px(s.x, s.y, s.w, 12, C.grass);
    for (let dx = 0; dx < s.w; dx += 22) {
      const tw = Math.min(10, s.x + s.w - (s.x + dx));
      if (tw > 0) px(s.x + dx, s.y, tw, 5, C.grassD);
    }
  } else {
    px(s.x, s.y, s.w, 6, C.stoneD);
  }
}
function drawOneway(p) {
  // 悬浮平台：草顶泥板
  px(p.x, p.y, p.w, p.h, C.dirt);
  px(p.x, p.y, p.w, 9, C.grass);
  for (let dx = 0; dx < p.w; dx += 22) {
    const tw = Math.min(10, p.w - dx);
    if (tw > 0) px(p.x + dx, p.y, tw, 4, C.grassD);
  }
  px(p.x, p.y + p.h - 3, p.w, 3, C.dirtD);
}
function drawMover(m) {
  if (m.fragile) {
    // 易碎移动平台：曲奇板（含裂纹/修复进度）+ 上下箭头
    if (!m.broken) {
      const a = Math.sin(performance.now() / 300) > 0 ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.45)";
      const cx = m.x + m.w / 2;
      px(cx - 3, m.y - 14, 6, 8, a);

  }
  // 电梯：金属板 + 黄黑警示条 + 上下箭头

  px(m.x, m.y + 12, m.w, 4, C.metalD);
  for (let dx = 4; dx < m.w - 8; dx += 18) px(m.x + dx, m.y + 4, 9, 8, "#ffd23f");
  // 中央箭头指示（呼吸闪烁）
  const a = Math.sin(performance.now() / 300) > 0 ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.45)";
  const cx = m.x + m.w / 2;
  px(cx - 3, m.y - 14, 6, 8, a);

function drawFragTile(x, y, w, h, o) {
  if (o.broken) {
    // 碎裂中：淡淡残影 + 修复进度条
    ctx.globalAlpha = 0.2;
    px(x, y, w, h, "#c98f4e");
    ctx.globalAlpha = 1;
    px(x, y + h - 3, w * (1 - o.rt / FRAG_REPAIR_T), 3, "#ffd23f");
    return;
  }
  const danger = o.t / FRAG_BREAK_T;
  const shake = o.t > 0 ? Math.sin(performance.now() / 32) * danger * 3 : 0;
  const sx = x + shake;
  // 曲奇板
  px(sx, y, w, h, "#cf9550");
  px(sx, y, w, 7, "#e0ac6a");
  px(sx, y + h - 3, w, 3, "#a9693a");
  for (let dx = 9; dx < w - 8; dx += 26) px(sx + dx, y + 9, 5, 3, "#8a5a2e");
  // 裂纹随计时增多
  if (o.t > 0) {
    ctx.strokeStyle = "rgba(70,36,12,.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    const n = Math.min(5, 1 + Math.floor(danger * 5));
    for (let i = 0; i < n; i++) {
      const cxx = sx + w * (0.14 + i * 0.18);
      ctx.moveTo(cxx, y + 2);
      ctx.lineTo(cxx + (i % 2 ? 8 : -7), y + h - 2);
    }
    ctx.stroke();
  }
  // 快碎时红色闪烁警示
  if (danger > 0.6) {
    ctx.globalAlpha = (danger - 0.6) / 0.4 * (Math.sin(performance.now() / 55) > 0 ? 1 : 0.25);
    px(sx, y, w, 3, "#ff5a4a");
    ctx.globalAlpha = 1;
  }
}
function drawFrag(f) { drawFragTile(f.x, f.y, f.w, f.h, f); }
/* ---- 传送门：椭圆漩涡，同对同色（0/1 蓝对、2/3 紫对）；need:"cake" 的门未吃蛋糕时灰显加锁 ---- */
function drawPortal(p, idx) {
  const t = performance.now() / 1000;
  const PORTAL_COLORS = ["#5ab8ff", "#c060ff"];             // 每对门一种颜色：蓝对 / 紫对
  const locked = p.need === "cake" && !cakeEaten;
  const col = locked ? "#8a7fa3" : PORTAL_COLORS[Math.floor(idx / 2) % PORTAL_COLORS.length];
  const cx = p.x, cy = p.y - 24;
  // 地面光圈
  ctx.fillStyle = "rgba(0,0,0,.14)";
  ctx.beginPath(); ctx.ellipse(cx, p.y + 1, 15, 4, 0, 0, 7); ctx.fill();
  // 外发光（呼吸；锁定时只剩微光）
  ctx.globalAlpha = locked ? 0.1 : 0.22 + 0.08 * Math.sin(t * 4 + idx);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(cx, cy, 22, 28, 0, 0, 7); ctx.fill();
  // 门体
  ctx.globalAlpha = 0.95;
  ctx.beginPath(); ctx.ellipse(cx, cy, 15, 22, 0, 0, 7); ctx.fill();
  // 内部暗
  ctx.fillStyle = "#1b1436";
  ctx.beginPath(); ctx.ellipse(cx, cy, 10, 17, 0, 0, 7); ctx.fill();
  if (locked) {
    // 小锁标记：锁梁 + 锁身 + 钥匙孔
    px(cx - 5, cy - 8, 10, 3, "#dfe4ec");
    px(cx - 5, cy - 5, 3, 4, "#dfe4ec");
    px(cx + 2, cy - 5, 3, 4, "#dfe4ec");
    px(cx - 6, cy - 1, 12, 9, "#c6ccd6");
    px(cx - 1, cy + 1, 2, 3, "#5a5468");
    px(cx - 1, cy + 4, 2, 2, "#5a5468");
  } else {
    // 旋转光点
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 5; i++) {
      const a = t * 2.4 + i * 1.257;
      px(cx + Math.cos(a) * 12 - 2, cy + Math.sin(a) * 19 - 2, 4, 4, "rgba(255,255,255,.9)");
    }
  }
  ctx.globalAlpha = 1;
}
/* ---- 刺虫：紫红胖身 + 黄色背刺 + 怒眼，六条小碎腿，在区间内巡逻 ---- */
function drawBug(b) {
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 9) > 0 ? -1 : 0;
  const wig = Math.sin(t * 14) > 0 ? 1 : -1;
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + bob);
  ctx.scale(b.dir, 1);
  // 六条小碎腿
  for (let i = 0; i < 3; i++) {
    const lx = -10 + i * 7;
    px(lx, -4 + (wig > 0 ? 0 : 1), 2, 4, "#4a2238");
    px(lx + 5, -4 + (wig > 0 ? 1 : 0), 2, 4, "#4a2238");
  }
  // 黄色背刺（阶梯像素模拟尖刺）
  for (const [sx0, sh] of [[-11, 5], [-5, 7], [1, 7], [7, 5]]) {
    px(sx0, -14 - sh, 4, sh, "#ffd23f");
    px(sx0 + 1, -14 - sh - 1, 2, 2, "#ffd23f");
  }
  // 圆胖身体
  px(-13, -12, 26, 10, "#9c4a6b");
  px(-11, -13, 22, 2, "#b6608a");
  px(-11, -4, 22, 2, "#6e2f4c");
  // 体节
  px(-5, -12, 2, 10, "#6e2f4c");
  px(3, -12, 2, 10, "#6e2f4c");
  // 头部（前方）
  px(9, -12, 5, 8, "#b6608a");
  // 怒眉 + 白眼黑瞳
  px(9, -13, 5, 2, "#4a2238");
  px(10, -11, 3, 3, "#fff");
  px(11, -10, 2, 2, "#161616");
  // 小颚
  px(13, -6, 3, 2, "#4a2238");
  ctx.restore();
}
function drawOrb(o) {

function drawTutorial() {

    ctx.globalAlpha = Math.min(1, hintT / 1.5);
    px(x0 + 4, y0 + 4, bw, bh, "rgba(0,0,0,.35)");
    px(x0, y0, bw, bh, "rgba(20,12,45,.9)");
    px(x0, y0, bw, 4, C.panelE); px(x0, y0 + bh - 4, bw, 4, C.panelE);
    pixelText("🎮 新手教程", W / 2, y0 + 12, 20, "#ffd23f", "center", false);
    pixelText(IS_TOUCH ? "移动：按住左半屏拖动 · 跳跃：点右侧「跳」键" : "移动：← → / A D · 跳跃：空格 / ↑",
              W / 2, y0 + 48, 14, "#fff", "center", false);
    pixelText("规则：吃到蛋糕 → 家门打开 → 回家即过关", W / 2, y0 + 74, 14, "#cfe8ff", "center", false);
    pixelText("小心别摔出画面，摔下去会回到出生点", W / 2, y0 + 98, 12, "#9fd8ff", "center", false);
    ctx.globalAlpha = 1;
  }
  // 情境提示气泡：跟着玩家进度走
  const feet = player.y + player.h;
  const m = LV.movers[0];
  const onMover = player.stand === m;
  let lines = null, cx = 0, cy = 0;
  if (!cakeEaten) {
    if (feet > 460 && player.x < 280 && !onMover) {
      lines = ["移动：" + (IS_TOUCH ? "左半屏摇杆" : "← → / A D"), "走向右边的电梯 →"]; cx = 150; cy = 350;
    } else if (feet > 460 && player.x < 442 && !onMover) {
      lines = ["站上去，电梯会载你上高处"]; cx = 368; cy = 400;
    } else if (onMover && feet > 170) {
      lines = ["电梯上升中…"]; cx = 368; cy = Math.min(feet - 90, 430);
    } else if (feet <= 170) {
      lines = ["向左走，吃掉蛋糕 🍰"]; cx = 150; cy = 210;
    }
  } else {
    if (feet <= 170 || (onMover && m.y < 460)) {
      lines = ["蛋糕到手！乘电梯下去 →"]; cx = 368; cy = 230;
    } else if (feet > 460 && player.x < 700) {
      lines = ["向右走到底"]; cx = 620; cy = 390;
    } else if (feet > 460) {
      lines = ["跳跃：" + (IS_TOUCH ? "点右侧「跳」键" : "空格 / ↑"), "连跳三层台阶上去"]; cx = 800; cy = 320;
    } else {
      lines = ["继续上跳，再向左回家 🏠"]; cx = 700; cy = 250;
    }
  }
  if (lines) drawBubble(lines, cx, cy);
}
/* ---- 第二关「烘焙的精髓」教学：只介绍易碎平台 ---- */
function drawTut2() {
  if (hintT > 0) {
    const bw = 500, bh = 78, x0 = (W - bw) / 2, y0 = 74;
    ctx.globalAlpha = Math.min(1, hintT / 1.5);
    px(x0 + 4, y0 + 4, bw, bh, "rgba(0,0,0,.35)");
    px(x0, y0, bw, bh, "rgba(20,12,45,.9)");
    px(x0, y0, bw, 4, C.panelE); px(x0, y0 + bh - 4, bw, 4, C.panelE);
    pixelText("🍪 烘焙的精髓", W / 2, y0 + 12, 19, "#ffd23f", "center", false);
    pixelText("易碎平台：踩过一次 1 秒后碎裂，4 秒后重新修复", W / 2, y0 + 46, 14, "#fff", "center", false);
    ctx.globalAlpha = 1;
  }
  // 情境提示气泡：只提易碎平台
  const feet = player.y + player.h;
  let lines = null, cx = 0, cy = 0;
  if (player.stand && player.stand.armed) {
    lines = ["这块曲奇 1 秒后就会碎，快跳走！"]; cx = player.x + 15; cy = player.y - 46;
  } else if (!cakeEaten && feet > 460 && player.x < 300) {
    lines = ["踩上会上下移动的曲奇 →", "它 1 秒后就会碎，别久留"]; cx = 300; cy = 380;
  }
  if (lines) drawBubble(lines, cx, cy);
}
/* ---- 第三关「糖霜的彼岸」教学：只讲传送门 + 刺虫 ---- */
function drawTut3() {
  if (hintT > 0) {
    const bw = 540, bh = 100, x0 = (W - bw) / 2, y0 = 74;
    ctx.globalAlpha = Math.min(1, hintT / 1.5);
    px(x0 + 4, y0 + 4, bw, bh, "rgba(0,0,0,.35)");
    px(x0, y0, bw, bh, "rgba(20,12,45,.9)");
    px(x0, y0, bw, 4, C.panelE); px(x0, y0 + bh - 4, bw, 4, C.panelE);
    pixelText("🌀 糖霜的彼岸", W / 2, y0 + 12, 19, "#ffd23f", "center", false);
    pixelText("传送门成对出现：走进一扇就从另一扇出来，回程也靠它", W / 2, y0 + 44, 14, "#9fd8ff", "center", false);
    pixelText("刺虫在固定路线巡逻，碰到就回起点，找准时机跳过它！", W / 2, y0 + 68, 14, "#fff", "center", false);
    ctx.globalAlpha = 1;
  }
  // 情境提示气泡（只提示传送门与刺虫，其他机关前两关已学过）
  const feet = player.y + player.h;
  let lines = null, cx = 0, cy = 0;
  if (feet > 460 && player.x >= 300 && player.x < 480) {
    lines = ["刺虫在巡逻，找准时机跳过它！"]; cx = 390; cy = 330;
  } else if (!cakeEaten && feet > 460 && player.x >= 700) {
    lines = ["走进蓝色传送门 ↑"]; cx = 730; cy = 360;
  } else if (cakeEaten && feet <= 460) {
    lines = ["原路返回，进蓝门回地面 ←"]; cx = 250; cy = 190;
  } else if (cakeEaten && feet > 460 && player.x >= 700) {
    lines = ["向右走，家就在前面 →"]; cx = 860; cy = 360;
  }
  if (lines) drawBubble(lines, cx, cy);
}
function drawTouchControls() {
  if (!IS_TOUCH) return;
  const knob = IS_TOUCH ? 26 : 20;          // 摇杆滑块半径（触屏同步放大）
  // 摇杆
  if (joy.active) {
    ctx.fillStyle = "rgba(20,12,45,.3)";
    ctx.beginPath(); ctx.arc(joy.ax, joy.ay, joyR, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ax, joy.ay, joyR, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,210,63,.85)";
    ctx.beginPath(); ctx.arc(joy.ax + joy.dx, joy.ay + joy.dy, knob, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(20,12,45,.22)";
    ctx.beginPath(); ctx.arc(JOY_IDLE.x, JOY_IDLE.y, joyR, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(JOY_IDLE.x, JOY_IDLE.y, joyR, 0, 7); ctx.stroke();
    pixelText("移动", JOY_IDLE.x, JOY_IDLE.y - 10, IS_TOUCH ? 16 : 14, "rgba(255,255,255,.6)", "center", false);
  }
  // 跳跃按钮
  const glow = jumpBtnHold;
  const jfs = IS_TOUCH ? 32 : 24;
  ctx.fillStyle = glow ? "rgba(255,210,63,.6)" : "rgba(20,12,45,.3)";
  ctx.beginPath(); ctx.arc(JUMP_BTN.x, JUMP_BTN.y, JUMP_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = glow ? "#ffd23f" : "rgba(255,255,255,.5)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(JUMP_BTN.x, JUMP_BTN.y, JUMP_BTN.r, 0, 7); ctx.stroke();
  pixelText("跳", JUMP_BTN.x - jfs * 0.58, JUMP_BTN.y - jfs / 2 - 1, jfs, "#fff", "left", false);
}
function drawButton(b, hover) {
  const c = hover ? "#ffe278" : C.btn;
  const fs = IS_TOUCH ? 21 : 15;                     // 触屏按钮更大，字号同步放大
  px(b.x + 3, b.y + 3, b.w, b.h, "rgba(0,0,0,.35)");
  px(b.x, b.y, b.w, b.h, c);
  px(b.x, b.y, b.w, 4, "#fff3c0");
  px(b.x, b.y + b.h - 4, b.w, 4, C.btnD);
  pixelText(b.label, b.x + b.w / 2, b.y + (b.h - fs) / 2 + 1, fs, C.btnText, "center", false);
}
/* 顶栏小按钮（返回大厅 / 返回）配色与字号统一 */
function drawTopBtn(b) {
  const fs = IS_TOUCH ? 17 : 13;
  px(b.x, b.y, b.w, b.h, "rgba(20,12,45,.6)");
  px(b.x, b.y, b.w, 3, "rgba(255,255,255,.4)");
  pixelText(b.label, b.x + b.w / 2, b.y + (b.h - fs) / 2 + 1, fs, "#fff", "center", false);
}
function render() {
  drawBackground();
  if (!LV) { drawMenu(); return; }

  // 场景
  // 深坑阴影（提示这里是深渊）
  if (LV.pit) {
    const pg = ctx.createLinearGradient(0, 470, 0, H);
    pg.addColorStop(0, "rgba(20,12,45,.12)");
    pg.addColorStop(1, "rgba(20,12,45,.92)");
    ctx.fillStyle = pg;
    ctx.fillRect(LV.pit.x, 470, LV.pit.w, H - 470);
  }
  for (const s of LV.solids) drawSolid(s);
  for (const p of LV.oneways) drawOneway(p);
  for (const f of LV.frags) drawFrag(f);
  for (const o of LV.orbs) drawOrb(o);
  LV.portals.forEach((p, i) => drawPortal(p, i));
  for (const b of LV.bugs) drawBug(b);
  for (const m of LV.movers) drawMover(m);
  drawHome();
  drawCake();
  drawParticles();
  if (state === ST.PLAY || state === ST.WIN) drawPlayer();

  if (state === ST.PLAY) {
    drawHUD();
    drawTutorial();
    drawTopBtn(HUB_BTN);
    drawTouchControls();
  } else if (state === ST.MENU) {
    drawMenu();
  } else if (state === ST.SELECT) {
    drawSelect();
  } else if (state === ST.WIN) {
    drawHUD();
    if (winT > 0.4) drawWinPanel();
  }
}
function drawMenu() {
  ctx.fillStyle = "rgba(20,12,45,.42)";
  ctx.fillRect(0, 0, W, H);
  if (LV) {   // 场景作为背景
    for (const s of LV.solids) drawSolid(s);
    for (const p of LV.oneways) drawOneway(p);
    for (const m of LV.movers) drawMover(m);
    for (const f of LV.frags) drawFrag(f);
    for (const o of LV.orbs) drawOrb(o);
    LV.portals.forEach((p, i) => drawPortal(p, i));
    for (const b of LV.bugs) drawBug(b);
    drawHome(); drawCake();
    ctx.fillStyle = "rgba(20,12,45,.55)";
    ctx.fillRect(0, 0, W, H);
  }
  // 当前形象立绘
  const msk = SKINS[skin] || SKINS.nailong;
  drawSprite(msk.spr.runA, W / 2 - 36, 96, 4.5, msk.pal, false);
  // 蛋糕点缀
  drawSprite(CAKE_MAP, W / 2 + 52, 130, 3, CAKE_PAL, false);

  const ty = 34 + Math.round(Math.sin(performance.now() / 400) * 2);
  pixelText("奶龙吃蛋糕", W / 2 + 3, ty + 3, 44, "rgba(0,0,0,.45)", "center", false);
  pixelText("奶龙吃蛋糕", W / 2, ty, 44, "#ffd23f", "center", false);
  pixelText("吃到蛋糕 · 平台间跳跃 · 安全回家", W / 2, 186, 15, "#cfe8ff", "center");

  drawButton(BTN_START, false);
  drawButton(BTN_SELECT, false);
  drawTopBtn(HUB_BTN);
  // 形象选择卡（通过第 3/6/9 关解锁新形象）
  for (const sc of skinCards()) {
    const sk2 = SKINS[sc.id];
    const sel = sc.id === skin;
    px(sc.x + 3, sc.y + 3, sc.w, sc.h, "rgba(0,0,0,.35)");
    px(sc.x, sc.y, sc.w, sc.h, sel ? "#4a3a86" : C.panel);
    if (sel) { px(sc.x, sc.y, sc.w, 3, "#ffd23f"); px(sc.x, sc.y + sc.h - 3, sc.w, 3, "#ffd23f"); px(sc.x, sc.y, 3, sc.h, "#ffd23f"); px(sc.x + sc.w - 3, sc.y, 3, sc.h, "#ffd23f"); }
    if (sc.ok) {
      drawSprite(sk2.spr.runA, sc.x + (sc.w - 40) / 2, sc.y + 8, 2.5, sk2.pal, false);
      pixelText(sc.name, sc.x + sc.w / 2, sc.y + 54, 12, "#fff", "center", false);
    } else {
      ctx.globalAlpha = 0.35;
      drawSprite(sk2.spr.runA, sc.x + (sc.w - 40) / 2, sc.y + 8, 2.5, sk2.pal, false);
      ctx.globalAlpha = 1;
      pixelText("🔒", sc.x + sc.w / 2, sc.y + 22, 14, "#fff", "center", false);
      pixelText(`过${sc.need}关`, sc.x + sc.w / 2, sc.y + 54, 12, "#a89cc8", "center", false);
    }
  }
  if (!IS_TOUCH) pixelText("空格快速开始 · 选关挑选关卡 · 点击卡片换形象", W / 2, BTN_START.y + BTN_START.h + 26, 12, "#fff", "center");
}
/* ---- 选关界面 ---- */
function drawSelect() {
  ctx.fillStyle = "rgba(20,12,45,.76)";
  ctx.fillRect(0, 0, W, H);

  const ty = 38 + Math.round(Math.sin(performance.now() / 400) * 2);
  pixelText("选择关卡", W / 2 + 3, ty + 3, 38, "rgba(0,0,0,.45)", "center", false);
  pixelText("选择关卡", W / 2, ty, 38, "#ffd23f", "center", false);
  pixelText(`已通关 ${Math.max(0, progress - 1)} / ${LEVELS.length} 关`, W / 2, 116, 13, "#cfe8ff", "center");

  for (const lc of levelCards()) {
    px(lc.x + 4, lc.y + 4, lc.w, lc.h, "rgba(0,0,0,.35)");
    px(lc.x, lc.y, lc.w, lc.h, lc.cleared ? "#33543a" : C.panel);
    px(lc.x, lc.y, 6, lc.h, lc.cleared ? "#7ed37f" : C.panelE);
    px(lc.x, lc.y, lc.w, 4, "#fff3c0");
    // 关卡序号
    px(lc.x + 18, lc.y + 24, 46, 46, "#241b47");
    px(lc.x + 18, lc.y + 24, 46, 4, lc.cleared ? "#7ed37f" : C.panelE);
    pixelText(String(lc.idx + 1), lc.x + 41, lc.y + 35, 24, "#ffd23f", "center", false);
    // 关卡名与状态
    pixelText(lc.label, lc.x + 78, lc.y + 24, 18, "#fff", "left", false);
    pixelText(lc.cleared ? "已通关 ✓" : "待挑战", lc.x + 78, lc.y + 52, 13,
              lc.cleared ? "#9fe0a2" : "#cfe8ff", "left", false);
    // 机关标签
    let tx = lc.x + 78;
    for (const tg of lc.tags) {
      const tw = tg.length * 12 + 14;
      px(tx, lc.y + 70, tw, 17, "rgba(255,210,63,.16)");
      ctx.strokeStyle = "rgba(255,210,63,.5)"; ctx.lineWidth = 1;
      ctx.strokeRect(tx + 0.5, lc.y + 70.5, tw - 1, 16);
      pixelText(tg, tx + tw / 2, lc.y + 74, 11, "#ffe873", "center", false);
      tx += tw + 8;
    }
  }

  drawTopBtn(BTN_BACK);

  if (!IS_TOUCH) pixelText("点击卡片开始 · ESC 返回", W / 2, H - 36, 12, "#cfe8ff", "center");
}
function drawWinPanel() {
  ctx.fillStyle = "rgba(10,6,28,.6)";
  ctx.fillRect(0, 0, W, H);
  const pw = 520, ph = 240, x0 = (W - pw) / 2, y0 = (H - ph) / 2 - 20;
  px(x0 + 5, y0 + 5, pw, ph, "rgba(0,0,0,.4)");
  px(x0, y0, pw, ph, C.panel);
  px(x0, y0, pw, 5, C.panelE);
  px(x0, y0 + ph - 5, pw, 5, C.panelE);
  px(x0, y0, 5, ph, C.panelE);
  px(x0 + pw - 5, y0, 5, ph, C.panelE);

  pixelText("通过！", W / 2, y0 + 26, 40, "#ffd23f", "center", false);
  pixelText("奶龙吃到了蛋糕，安全到家啦！", W / 2, y0 + 82, 15, "#cfe8ff", "center");
  pixelText(`本关：${LV.name}`, W / 2, y0 + 108, 13, "#9fd8ff", "center");
  // 过关奖励：刚解锁形象时弹出提示
  if (newUnlock) {
    const us = SKINS[newUnlock];
    pixelText(`🎉 解锁新形象「${us.name}」！`, W / 2 - 30, y0 + 136, 16, "#ffe873", "center", false);
    drawSprite(us.spr.runA, W / 2 + 128, y0 + 122, 2, us.pal, false);
    pixelText("已加入主菜单的形象列表", W / 2, y0 + 162, 12, "#9fd8ff", "center", false);
  }

  // 按钮（触屏下更大，字号同步放大）
  const hasNext = levelIdx + 1 < LEVELS.length;
  const bfs = IS_TOUCH ? 20 : 15;
  const byOf = b => b.y + (b.h - bfs) / 2 + 1;
  // 下一关
  px(BTN_NEXT.x + 3, BTN_NEXT.y + 3, BTN_NEXT.w, BTN_NEXT.h, "rgba(0,0,0,.35)");
  px(BTN_NEXT.x, BTN_NEXT.y, BTN_NEXT.w, BTN_NEXT.h, hasNext ? C.btn : "#554a7a");
  pixelText(hasNext ? "下一关" : "敬请期待", BTN_NEXT.x + BTN_NEXT.w / 2, byOf(BTN_NEXT), bfs, hasNext ? C.btnText : "#a89cc8", "center", false);
  // 再玩一次
  px(BTN_AGAIN.x + 3, BTN_AGAIN.y + 3, BTN_AGAIN.w, BTN_AGAIN.h, "rgba(0,0,0,.35)");
  px(BTN_AGAIN.x, BTN_AGAIN.y, BTN_AGAIN.w, BTN_AGAIN.h, "#9fd8ff");
  pixelText("再玩一次", BTN_AGAIN.x + BTN_AGAIN.w / 2, byOf(BTN_AGAIN), bfs, "#0e2a4a", "center", false);
  // 返回大厅
  px(BTN_HUB2.x + 3, BTN_HUB2.y + 3, BTN_HUB2.w, BTN_HUB2.h, "rgba(0,0,0,.35)");
  px(BTN_HUB2.x, BTN_HUB2.y, BTN_HUB2.w, BTN_HUB2.h, "#ff9aa9");
  pixelText("返回大厅", BTN_HUB2.x + BTN_HUB2.w / 2, byOf(BTN_HUB2), bfs, "#5a1020", "center", false);
}

/* ================= 移动端画布适配（与跑酷同方案） =================
   纯 CSS 视口单位在微信等内置浏览器里不可靠，用 JS 读 innerWidth/innerHeight 精确计算；
   竖屏时把 #wrap 旋转 90° 模拟横屏，让画布尽量铺满整屏。 */
let wrapRotated = false;
function layoutWrap(w, h, touch) {
  const wrap = document.getElementById("wrap");
  if (!touch) { wrap.style.width = ""; wrap.style.transform = ""; wrapRotated = false; return; }
  wrapRotated = h > w;                                          // 竖屏 → 旋转 90°
  const cw = wrapRotated ? Math.min(w * 16 / 9, h) : Math.min(w, h * 16 / 9);
  wrap.style.width = Math.round(cw) + "px";
  wrap.style.transform = wrapRotated ? "rotate(90deg)" : "none";
}
function fitWrap() { layoutWrap(innerWidth, innerHeight, IS_TOUCH); }
addEventListener("resize", fitWrap);
addEventListener("orientationchange", fitWrap);
fitWrap();

/* ================= 启动 ================= */
loadLevel(0);          // 菜单背后先摆好第一关场景
requestAnimationFrame(frame);
</script>
