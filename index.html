<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶龙游戏集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }
  body {
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at 50% 12%, #34255f 0%, #1b1436 62%, #120c28 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 34px 16px 46px;
    overflow-x: hidden;
  }
  .title {
    font-size: clamp(34px, 7vw, 58px);
    font-weight: bold;
    color: #ffd23f;
    text-shadow: 3px 3px 0 rgba(0,0,0,.45);
    letter-spacing: 4px;
    animation: float 2.6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .subtitle { margin-top: 10px; color: #cfe8ff; font-size: clamp(13px, 2.6vw, 17px); opacity: .9; }
  .grid {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 26px;
    max-width: 980px;
    width: 100%;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: #fff;
    width: 300px;
    background: linear-gradient(180deg, #2e2358 0%, #241b47 100%);
    border: 3px solid #4a3a86;
    border-radius: 14px;
    padding: 20px 18px 18px;
    text-align: center;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  a.card:hover {
    transform: translateY(-6px);
    border-color: #ffd23f;
    box-shadow: 0 16px 34px rgba(0,0,0,.55), 0 0 22px rgba(255,210,63,.25);
  }
  a.card:active { transform: translateY(-2px) scale(.98); }
  .preview {
    width: 132px; height: 132px;
    margin: 0 auto;
    background: #8fd3ff;
    border: 3px solid #0d0a1f;
    border-radius: 10px;
    image-rendering: pixelated;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card h2 { margin-top: 14px; font-size: 22px; color: #ffd23f; letter-spacing: 2px; }
  .card p { margin-top: 8px; font-size: 13px; color: #cfc6f2; line-height: 1.7; }
  .card .tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(255,210,63,.16);
    border: 1px solid rgba(255,210,63,.55);
    color: #ffe873;
  }
  .card.soon {
    opacity: .55;
    border-style: dashed;
    cursor: default;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 288px;
  }
  .card.soon:hover { transform: none; border-color: #4a3a86; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  .soon .q { font-size: 46px; color: #6f5fa8; }
  .soon p { margin-top: 6px; }
  footer { margin-top: 38px; color: #6f5fa8; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="title">奶龙游戏集</div>
  <div class="subtitle">选一个小游戏开始冒险吧！</div>

  <div class="grid">
    <a class="card" href="damaoxian/index.html">
      <canvas class="preview" id="pv1" width="26" height="26"></canvas>
      <h2>奶龙大冒险</h2>
      <p>像素跑酷 · 三段跳躲避障碍<br>普通 / 进阶双模式 · 形象收集</p>
      <span class="tag">跑酷</span>
    </a>
    <a class="card" href="cake/index.html">
      <canvas class="preview" id="pv2" width="26" height="26"></canvas>
      <h2>奶龙吃蛋糕</h2>
      <p>横板闯关 · 平台跳跃<br>先吃蛋糕再回家</p>
      <span class="tag">闯关</span>
    </a>
    <a class="card" href="baowei/index.html">
      <canvas class="preview" id="pv3" width="26" height="26"></canvas>
      <h2>奶龙保卫战</h2>
      <p>Roguelike 塔防 · 建造机关<br>抵御敌人守护奶龙</p>
      <span class="tag">塔防</span>
    </a>
    <div class="card soon">
      <div class="q">?</div>
      <h2>更多游戏</h2>
      <p>新游戏正在赶来的路上…</p>
    </div>
  </div>

  <footer>奶龙游戏集 · 每个小游戏独立开发，持续更新中</footer>

<script>
"use strict";
/* 卡片预览：像素小画（奶龙 / 蛋糕） */
function drawMap(cv, map, pal, scale) {
  const c = cv.getContext("2d");
  c.imageSmoothingEnabled = false;
  c.clearRect(0, 0, cv.width, cv.height);
  const rows = map.length, cols = map[0].length;
  const ox = (cv.width - cols * scale) / 2, oy = (cv.height - rows * scale) / 2;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const color = pal[map[r][col]];
      if (color) { c.fillStyle = color; c.fillRect(ox + col * scale, oy + r * scale, scale, scale); }
    }
  }
}
const NAILONG_PAL = {
  "#": "#8a4513", "y": "#ffc93c", "o": "#efa01e", "b": "#fff0c6",
  "w": "#ffffff", "g": "#4aa64f", "d": "#1c6b33", "k": "#161616",
  "p": "#96501f", "m": "#6e3a12"
};
const NAILONG = [
  ".......###......",
  ".....#yyyy#.....",
  "...#yyyyyyyy#...",
  "..#yyyyywwwww#..",
  ".#yyyyyywgwkwy#.",
  ".#yyyyyywggkwy#.",
  ".#yyyyyywgkkwy#.",
  ".#yyyyyywwwwwy#.",
  ".#yyyyyyyymmyy#.",
  "..##yyyyyyyyy#..",
  "#yyyyyybbbbb#yp.",
  "#yyyooybbbbbbb#..",
  ".ooyyybbbbbbby#..",
  ".#yyyyy..yyyy#..",
  "..#yyyy..yyyy#..",
  "...yppp..yppp..."
];
const CAKE_PAL = { "r": "#e33b4e", "w": "#fff6e8", "p": "#f2a7c3", "b": "#c99056" };
const CAKE = [
  ".....rr.....",
  "....rrrr....",
  "..wwwwwwww..",
  ".wwwwwwwwww.",
  "pppppppppppp",
  "pppppppppppp",
  "wwwwwwwwwwww",
  "wwwwwwwwwwww",
  "pppppppppppp",
  "pppppppppppp",
  "bbbbbbbbbbbb",
  "bbbbbbbbbbbb"
];
const SHIELD_PAL = { "s": "#b8c4d0", "y": "#ffd23f", "d": "#7d8a99" };
const SHIELD = [
  "....ssss....",
  "..ssssssss..",
  ".ssyyyyyyss.",
  "ssyyyyyyyyss",
  "ssyyyddyyyss",
  "ssyyyddyyyss",
  "ssyyyyyyyyss",
  ".ssyyyyyyss.",
  "..ssyyyyss..",
  "...ssyyss...",
  "....ssss....",
  ".....ss....."
];
drawMap(document.getElementById("pv1"), NAILONG, NAILONG_PAL, 1.4);
drawMap(document.getElementById("pv2"), CAKE, CAKE_PAL, 2.1);
drawMap(document.getElementById("pv3"), SHIELD, SHIELD_PAL, 2.1);
</script>
</body>
</html>
