/* 像素精灵绘制：把每个字符格映射成一块矩形，边界取整避免出现接缝，
   因此放大倍数可以是任意实数（用于史莱姆的果冻挤压等非等比形变）。 */
function drawSpriteXY(map, ox, oy, sx, sy, pal, flip) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r], n = row.length;
    const y0 = (oy + r * sy) | 0, y1 = (oy + (r + 1) * sy) | 0;
    for (let c = 0; c < n; c++) {
      const col = pal[row[flip ? n - 1 - c : c]];
      if (col) {
        const x0 = (ox + c * sx) | 0, x1 = (ox + (c + 1) * sx) | 0;
        ctx.fillStyle = col; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }
}
function drawSprite(map, ox, oy, scale, pal, flip) { drawSpriteXY(map, ox, oy, scale, scale, pal, flip); }
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, Math.ceil(w), Math.ceil(h));
}
function pixelText(str, x, y, size, color, align = "left", shadow = true) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.textAlign = "left";
}
function wrapText(str, maxChars) {           // 简单按字数折行（中文等宽）
  const out = [];
  for (let i = 0; i < str.length; i += maxChars) out.push(str.slice(i, i + maxChars));

}

     'S' 敌人出生点       'H' 奶龙所在格
   出生点与奶龙格均可有多个；敌人出场时随机挑一个奶龙格作为目标，
   路径在交叉/岔口处自然分流成多条支线。 */
const MAPS = [

      "...#..#..#..",
      "...#..#..#..",
      "...H..H..H..",
      "............"
    ]
  }
];
/* 地图解析：每个奶龙格各做一次 BFS（其他奶龙格视为不可通行），
   于是「每个出生点 → 每个奶龙格」各有一条路线；敌人出场时随机挑一个奶龙作为目标，
   交叉/岔口处便自然分成多条支线。 */
function parseMap(def) {
  const g = def.grid;
  const spawns = [], homes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (g[r][c] === "S") spawns.push({ c, r });
    else if (g[r][c] === "H") homes.push({ c, r });
  }
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const cellCenter = (c, r) => ({ x: GRID_OX + c * CELL + CELL / 2, y: GRID_OY + r * CELL + CELL / 2 });
  const routes = spawns.map(sp => homes.map(hm => {
    const ok = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS &&
      (g[r][c] === "#" || g[r][c] === "S" || (c === hm.c && r === hm.r));   // 其他奶龙格不可通行
    const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(-1));
    dist[hm.r][hm.c] = 0;
    const q = [{ c: hm.c, r: hm.r }];
    while (q.length) {
      const cur = q.shift();
      for (const [dc, dr] of DIRS) {
        const nc = cur.c + dc, nr = cur.r + dr;
        if (ok(nc, nr) && dist[nr][nc] < 0) { dist[nr][nc] = dist[cur.r][cur.c] + 1; q.push({ c: nc, r: nr }); }
      }
    }
    const path = [cellCenter(sp.c, sp.r)];
    if (dist[sp.r][sp.c] < 0) return path;                                  // 不可达（不应发生）
    let c = sp.c, r = sp.r;
    while (dist[r][c] > 0) {
      for (const [dc, dr] of DIRS) {
        const nc = c + dc, nr = r + dr;
        if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && dist[nr][nc] === dist[r][c] - 1) { c = nc; r = nr; break; }
      }
      path.push(cellCenter(c, r));
    }
    return path;
  }));
  // 方向箭头：汇总所有支线，同一段路只画一次
  const arrowSegs = [], seen = new Set();
  for (const perSpawn of routes) for (const rt of perSpawn) {
    for (let i = 0; i + 1 < rt.length; i += 2) {
      const a = rt[i], b = rt[i + 1];
      const key = [a.x, a.y, b.x, b.y].join(",");
      const rkey = [b.x, b.y, a.x, a.y].join(",");
      if (seen.has(key) || seen.has(rkey)) continue;
      seen.add(key);
      arrowSegs.push({ x: a.x, y: a.y, ch: b.x > a.x ? "→" : b.x < a.x ? "←" : b.y > a.y ? "↓" : "↑" });
    }
  }
  return { def, g, spawns, homes, routes, arrowSegs };
}
const cellChar = (c, r) => (c >= 0 && c < COLS && r >= 0 && r < ROWS) ? CUR.g[r][c] : ".";

/* ================= 音频：WebAudio 实时合成（无外部资源，保持单文件） ================= */
let AC = null;
function ac() {
  if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) { try { AC = new A(); } catch (e) {} } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol, freqEnd) {
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q) {                       // 滤波噪声（碎裂/爆炸质感）
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t0 = a.currentTime;
  src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; f.Q.value = q || 1;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t0);
}

                  659, 0, 784, 0, 880, 0, 784, 0, 659, 0, 587, 0, 523, 0, 0, 0];
const BGM_BASS = [131, 131, 98, 98, 110, 110, 98, 98, 87, 87, 98, 98, 131, 131, 98, 98];
let bgmTimer = null, bgmStep = 0;
function startBGM() {
  if (bgmTimer || !ac()) return;
  bgmTimer = setInterval(() => {
    const a = ac(); if (!a || a.state !== "running") return;
    const L = BGM_LEAD[bgmStep % BGM_LEAD.length], B = BGM_BASS[(bgmStep >> 1) % BGM_BASS.length];
    if (L) tone(L, 0, 0.16, "square", 0.045);
    if (bgmStep % 2 === 0 && B) tone(B, 0, 0.3, "triangle", 0.07);
    bgmStep++;
  }, 170);

function recomputeMods() {

  traps.forEach((t, i) => {

/* 局内属性公式（用户定）：最终属性 = 局外属性 × (1 + Σ局内百分比加成) + Σ局内固定数值加成（固定数值最后加算）
   例：局外 600、局内 +40% 与 +100 → 600×1.4 + 100 = 940；百分比字段 atk/defPct/hpF 等存于 mods.trapMods[机关id] */
/* 机关当前生命比例：伪实例（炸弹）无生命值 → 视为满血 */
const hpRatioOf = t => (t.hpMax ? t.hp / t.hpMax : 1);
function trapAtkOf(t, extra = 0, extraFlat = 0, noAdj = false) {
  const tm = mods.trapMods[t.base.id] || {};
  /* 随机应变：生命高于 50% 时攻击力 +20%（伪实例如炸弹无生命值，视为满血） */
  const adap = chosen.includes("adapt") && hpRatioOf(t) > 0.5 ? 0.2 : 0;
  /* 灯泡光环：每个上下左右相邻的灯泡按自身攻击力的 50% 提高本机关攻击力（固定值最后加算）；
     noAdj：计算灯泡自身攻击力时不再叠加其它灯泡的光环，避免两只相邻灯泡互相放大（无限反馈） */
  let adjBuff = 0;
  if (!noAdj && t.c != null) {
    for (const o of traps) {
      if (o.dead || !o.base.buff || o === t) continue;
      if (Math.abs(o.c - t.c) + Math.abs(o.r - t.r) === 1)
        adjBuff += Math.round(trapAtkOf(o, 0, 0, true) * o.base.buff);
    }
  }
  return Math.round(t.base.atk * (1 + mods.atkAll + (tm.atk || 0) + extra + adap) + (tm.atkF || 0) + extraFlat + (t.energizeT > 0 ? ENERGIZE_ATK : 0) + adjBuff);   // energizeT：精力充沛 buff，+250 走固定值最后加算
}
function trapDefOf(t) {
  const tm = mods.trapMods[t.base.id] || {};
  /* 随机应变：生命不高于 50% 时防御力 +20% */
  const adap = chosen.includes("adapt") && hpRatioOf(t) <= 0.5 ? 0.2 : 0;
  return Math.round(t.base.def * (1 + mods.defAll + (tm.defPct || 0) + adap) + (tm.def || 0));
}
function trapBlockOf(t) { const tm = mods.trapMods[t.base.id] || {}; return t.base.block + (tm.block || 0); }
function trapHpMaxOf(base) { const tm = mods.trapMods[base.id] || {}; return Math.round(base.hp * mods.trapHp + (tm.hpF || 0)); }
/* 伤害提升（取势等普通伤害提升）作用于被防御减免后的伤害；
   守卫等级独立伤害提升为另一乘区，与普通伤害提升互相乘算：lv.1 无提升，lv.2 +10%，lv.3 +20%，以此类推 */
function lvDmgMul() { return 1 + Math.max(0, lv - 1) * 0.1; }
function trapDmgOf(t, def, extra = 0) { return Math.round(calcDmg(trapAtkOf(t, extra), def) * (1 + mods.dmgUp) * lvDmgMul()); }
function trapIntervalOf(t) { const tm = mods.trapMods[t.base.id] || {}; return Math.max(0.2, (t.base.interval * (tm.interval || 1) + (tm.intervalFlat || 0)) / (1 + (mods.atkSpd || 0))); }   // intervalFlat：固定减少（百步穿杨 -0.5 秒）；atkSpd：科技「迅捷」攻击速度 +3%（攻击间隔 ÷1.03）
function buildAt(c, r) {
  const lt = loadout[selTrap];
  if (!lt) { hint(loadout.length ? "先选择要建造的机关" : "暂无可用机关，等待后续更新"); return false; }
  const base = trapEffBase(lt);                          // 应用研发等级加成（生命/攻击/防御）
  if (!buildableCell(c, r)) { hint("这里不能建造"); return false; }
  if (builtCount(base.id) >= TRAP_BUILD_CAP) { hint(`${base.name}至多建造 ${TRAP_BUILD_CAP} 个`); return false; }
  if (coins < base.cost) { hint("奶龙币不足"); return false; }
  coins -= base.cost;
  if (base.id === "bomb") {                            // 炸弹：立即对周围 2 格敌人造成伤害并损毁（不驻场）
    const bx = GRID_OX + c * CELL + CELL / 2, by = GRID_OY + r * CELL + CELL / 2;
    const bt = { base, c, r };                       // 伪实例：复用局内攻击/伤害加成公式（c/r 供灯泡光环判定相邻）
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - bx, e.y - by) <= BOMB_RANGE * CELL) {
        hurtEnemy(e, trapDmgOf(bt, e.def));
        if (!e.dead && chosen.includes("art"))          // 爆炸就是艺术：命中敌人晕眩 2 秒（晕眩抗性按百分比缩短）
          e.stunT = Math.max(e.stunT, STUN_TIME * (1 - resOf(e.base, "stun")));
      }
    }
    fx.push({ type: "boom", x: bx, y: by, r: BOMB_RANGE * CELL, ttl: 0.55 });
    shakeT = 0.4;                                      // 屏幕震动：强化爆破冲击感
    return true;
  }
  const hpMax = trapHpMaxOf(base);
  traps.push({
    base, c, r,
    x: GRID_OX + c * CELL + CELL / 2, y: GRID_OY + r * CELL + CELL / 2,
    hp: hpMax, hpMax, cd: 0, blocked: [], dead: false, flash: 0, frzT: 0, bonusT: 0, magicN: 0, charge: 0, burnT: 0
  });
  if (base.id === "boots" && !bootBonusUsed) {          // 靴子技能：每场战斗仅第一只靴子触发
    bootBonusUsed = true;
    traps[traps.length - 1].bonusT = BOOT_BONUS_TIME;
  }

}
function demolishAt(c, r) {
  const t = trapAt(c, r);
  if (!t) { hint("这里没有机关"); return false; }
  t.dead = true;
  for (const e of t.blocked) e.blockedBy = null;
  traps = traps.filter(x => x !== t);
  coins = Math.min(COIN_MAX, coins + Math.floor(t.base.cost * SELL_BACK));
  return true;
}

/* ================= 战斗引擎 ================= */
/* 伤害公式：MAX(攻击力 - 防御力, 攻击力 × 5%)，双向通用（敌↔机关） */
const calcDmg = (atk, def) => Math.max(atk - def, Math.ceil(atk * 0.05));
/* 抗性：按百分比减少受到的对应负面状态持续时间（0~1，默认 0；如 25% 麻痹抗性 → 麻痹时长 ×0.75） */
const resOf = (base, k) => Math.min(1, (base.res && base.res[k]) || 0);
const PARA_TIME = 0.8;                       // 麻痹时长（秒）：无法移动（被阻挡时的攻击不受影响）
const FREEZE_TIME = 1;                       // 冻结时长（秒）：机关无法行动（攻击/治疗/冷却暂停，阻挡仍有效）
const BOOT_BONUS_TIME = 5, BOOT_COIN_RATE = 100;   // 靴子技能：首建后 5 秒内每秒 +100 奶龙币（共 500）
const THORN_SLOW = 0.85, THORN_DPS = 150;          // 荆棘光环：所在格敌人移速 -85% + 每秒 150 真实伤害
const ENERGIZE_TIME = 5, ENERGIZE_ATK = 250;       // 精力充沛：受注射剂治疗后的攻击 buff 时长与数值
const BIRD_ATK_PAUSE = 0.5;                        // 飞鸟攻击时的定身时长（秒）
const SWEEP_RANGE = 1.3;                            // 武士挥砍：前方半圆的半径（格）
const BOMB_RANGE = 2;                        // 炸弹爆破半径（格）：建造后立即对范围内所有敌人造成伤害并损毁
const STUN_TIME = 2;                         // 晕眩时长（秒）：无法移动也无法攻击
const BOW_CHARGE_MUL = 0.5;                  // 弓箭蓄力：每层 +50% 攻击力（开火后清零）
const bowChargeMax = () => chosen.includes("snipe") ? 3 : 2;   // 蓄力层数上限（百步穿杨 +1）
const BURN_TIME = 5, BURN_DPS = 125;         // 灼烧（翼龙技能）：持续 5 秒，每秒 125 点真实伤害（无视防御）
const BOSS_BURN_BONUS = 1.8;                 // 翼龙对处于灼烧状态的机关造成的伤害 +80%
function waveMul(no) { return Math.pow(WAVE_CFG.scaleMul, Math.max(0, no - WAVE_CFG.lateWave)); }
const fmtMul = m => { const s = m.toFixed(2); return s.endsWith("0") ? s.slice(0, -1) : s; };   // ×1.1 / ×1.21
function waveEliteChance(no) { return no > WAVE_CFG.lateWave ? WAVE_CFG.eliteChanceLate : WAVE_CFG.eliteChance; }
/* 首领刷新概率：第 5 波之后每波提升 bossChanceStep，上限 bossChanceCap；第 5 波及之前为 0 */
function waveBossChance(no) {
  if (no <= WAVE_CFG.bossWaveFrom) return 0;
  return Math.min(WAVE_CFG.bossChanceCap, WAVE_CFG.bossChanceBase + (no - WAVE_CFG.bossWaveFrom - 1) * WAVE_CFG.bossChanceStep);
}
function waveCount(no) {                     // 每波刷怪数量：随波次提高（每 countGrowEvery 波 +1），有上限
  const b = WAVE_CFG.countBase + (((no - 1) / WAVE_CFG.countGrowEvery) | 0);
  return Math.min(WAVE_CFG.countCap, b + ((Math.random() * (WAVE_CFG.countRand + 1)) | 0));
}
/* 开新一波：随机数量 × 随机种类（按 tier 概率），敌人按波次倍率强化生命/攻击/防御后排队出场 */
function startWave() {
  waveIdx++;
  const mul = waveMul(waveIdx);
  const bossChance = waveBossChance(waveIdx);
  const bosses = ENEMIES.filter(e => e.tier === "boss");
  if (bosses.length && Math.random() < bossChance) {      // 首领波：该波只刷一只首领，不再刷新其他敌人
    const base = bosses[(Math.random() * bosses.length) | 0];
    spawnQ.push({ base, spawn: (Math.random() * CUR.spawns.length) | 0, mul, t: gameT });
    waveBannerT = 2.2; bossBannerT = 3.2;
    return;
  }
  const normals = ENEMIES.filter(e => e.tier === "normal");   // 精英与首领不进入普通池（精英按概率单独判定）
  const elites  = ENEMIES.filter(e => e.tier === "elite");
  const count = waveCount(waveIdx);
  for (let i = 0; i < count; i++) {
    const pool = (elites.length && Math.random() < waveEliteChance(waveIdx)) ? elites : normals;
    if (!pool.length) continue;                 // 图鉴为空时静默跳过
    const base = pool[(Math.random() * pool.length) | 0];
    spawnQ.push({ base, spawn: (Math.random() * CUR.spawns.length) | 0, mul, t: gameT + i * WAVE_CFG.spawnGap });
  }
  waveBannerT = 2.2;
}
function spawnEnemy(q) {
  const b = q.base;
  const perSpawn = CUR.routes[q.spawn % CUR.routes.length];
  if (!perSpawn || !perSpawn.length) return;
  const route = perSpawn[(Math.random() * perSpawn.length) | 0];   // 随机挑一个奶龙作为本敌人的目标
  const hp = Math.round(b.hp * q.mul * (nmRun ? NM_HP_MUL : 1));    // 噩梦守卫：敌人生命 ×200%
  enemies.push({
    base: b, route, routeIdx: 1,
    x: route[0].x, y: route[0].y,
    hp, maxHp: hp, atk: Math.round(b.atk * q.mul * (nmRun ? NM_ATK_MUL : 1)), def: Math.round(b.def * q.mul), interval: b.interval,   // 噩梦守卫：敌人攻击 ×150%
    flying: !!b.flying, elite: b.tier !== "normal", boss: b.tier === "boss",   // 首领与精英共用精英标记（金框/皇冠），首领额外放大
    cd: 0, blockedBy: null, dead: false, flash: 0, paraT: 0, stunT: 0,
    jx: Math.random() * 12 - 6, jy: Math.random() * 8 - 4
  });
}
/* 机关死亡处理：释放被阻挡敌人、碎裂音效与特效 */
function trapDie(t) {
  t.dead = true;
  sfxTrapDie();                                      // 机关被击败音效（低沉碎裂）
  for (const b of t.blocked) b.blockedBy = null;
  t.blocked.length = 0;
  fx.push({ type: "burst", x: t.x, y: t.y, ttl: 0.4, color: "#b8c4d0" });
}
/* 敌人对机关造成伤害的统一出口（按机关防御结算） */
function hurtTrap(t, atk) {
  t.hp -= calcDmg(atk, trapDefOf(t));
  t.flash = 0.12;
  if (t.hp > 0) return;
  trapDie(t);
}
/* 真实伤害（无视防御）：灼烧等持续伤害专用，不刷新白闪 */
function hurtTrapTrue(t, dmg) {
  t.hp -= dmg;
  if (t.hp <= 0 && !t.dead) trapDie(t);
}
function hurtEnemy(e, dmg, quiet) {
  e.hp -= dmg; if (!quiet) e.flash = 0.1;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; kills++; lab.rookie.kills++;        // rookie.kills：新手任务（累计消灭），随结算落盘
    if (nmRun) lab.ev.nmKills++;                        // 活动任务：噩梦守卫中击杀
    if (e.base.tier === "boss") lab.ev.pteroKills++;    // 活动任务：击败首领（当前只有翼龙）
    sfxEnemyDie();
    gainExp(e.base.exp);
    fx.push({ type: "burst", x: e.x + e.jx, y: e.y + e.jy, ttl: 0.4, color: e.base.color || "#c060ff" });
  }
}
function update(dt) {
  gameT += dt;
  coins = Math.min(COIN_MAX, coins + (COIN_RATE + mods.coinRate) * dt);
  if (hintT > 0) hintT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (waveBannerT > 0) waveBannerT -= dt;
  if (bossBannerT > 0) bossBannerT -= dt;

  /* ---- 波次调度：到点开新波（不超过总波次数）；波内敌人按 spawnGap 依次从出生点出场 ---- */
  if (waveIdx < maxWaveNow() && gameT >= nextWaveT) { startWave(); nextWaveT = gameT + WAVE_CFG.gap; }
  for (let i = spawnQ.length - 1; i >= 0; i--) {
    if (gameT >= spawnQ[i].t) { spawnEnemy(spawnQ[i]); spawnQ.splice(i, 1); }
  }

  /* ---- 荆棘光环格集合（存活荆棘所在格；真实伤害与减速均不吃任何加成/减免） ---- */
  const thornCells = new Set();
  for (const t of traps) if (!t.dead && t.base.thorns) thornCells.add(t.c + "," + t.r);

  /* ---- 敌人：移动 / 攻击机关 ---- */
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    const onThorn = !e.flying && thornCells.has(Math.floor((e.x - GRID_OX) / CELL) + "," + Math.floor((e.y - GRID_OY) / CELL));   // 地面荆棘不影响飞行敌人
    if (onThorn) { hurtEnemy(e, THORN_DPS * dt, true); if (e.dead) continue; }   // 荆棘：每秒 150 真实伤害（quiet 不刷屏白闪）
    if (e.blockedBy) {
      if (e.blockedBy.dead) { e.blockedBy = null; }
      else if (e.stunT <= 0 && !e.base.atkRange) {    // 远程敌人被阻挡时改用远程攻击，不走近战（避免同一回合双重攻击）
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = e.interval / mods.enemyAtkSpd;      // 疲惫：敌攻击速度 -18% → 攻击间隔变长
          if (e.base.sweep) {                         // 武士：挥刀攻击前方半径 1.3 格半圆内的所有机关
            const nxt = e.route[Math.min(e.routeIdx, e.route.length - 1)];
            let dirX = nxt.x - e.x, dirY = nxt.y - e.y; const fd = Math.hypot(dirX, dirY) || 1; dirX /= fd; dirY /= fd;   // 朝向 = 行进方向（前方）
            for (const t of traps) {
              if (t.dead) continue;
              const dx = t.x - e.x, dy = t.y - e.y;
              if (Math.hypot(dx, dy) <= SWEEP_RANGE * CELL && dx * dirX + dy * dirY >= -1e-6)   // 前方半圆：距离 ≤ 半径 且 点积 ≥ 0
                hurtTrap(t, e.atk);
            }
            fx.push({ type: "slash", x: e.x, y: e.y, ang: Math.atan2(dirY, dirX), r: SWEEP_RANGE * CELL, ttl: 0.25 });
          } else {
            const t = e.blockedBy;
            hurtTrap(t, e.atk);
            if (e.base.freeze && !t.dead) t.frzT = Math.max(t.frzT, FREEZE_TIME * (1 - resOf(t.base, "frz")));   // 雪人：攻击使机关冻结（冻结抗性按百分比缩短）
          }
        }
      }
    }
    if (e.base.atkRange && !e.dead && e.stunT <= 0) {   // 远程机关攻击：对 atkRange 格内最近的 maxTargets 个机关发起攻击（晕眩时无法行动；范围内无机关则待命不耗冷却）
      e.cd -= dt;
      if (e.cd <= 0) {
        const near = [];
        const maxN = e.base.maxTargets || 1;
        for (const t of traps) {
          if (t.dead) continue;
          const d = Math.hypot(t.x - e.x, t.y - e.y);
          if (d <= e.base.atkRange * CELL) near.push({ t, d });
        }
        if (near.length) {
          near.sort((a, b) => a.d - b.d);
          e.cd = e.interval / mods.enemyAtkSpd;
          if (maxN === 1) e.atkPauseT = BIRD_ATK_PAUSE;   // 飞鸟：单体攻击时短暂无法移动
          for (let i = 0; i < Math.min(maxN, near.length); i++) {
            const t = near[i].t;
            fx.push({ type: "tracer", x1: e.x, y1: e.y - AIR_LIFT, x2: t.x, y2: t.y, ttl: 0.09 });
            const dmg = Math.round(e.atk * ((t.burnT || 0) > 0 ? BOSS_BURN_BONUS : 1));   // 对灼烧状态的机关伤害 +80%
            hurtTrap(t, dmg);
            if (e.base.burn && !t.dead) t.burnT = BURN_TIME;    // 灼烧：刷新为 5 秒（每秒 125 真实伤害）
          }
        }
      }
    }
    if (e.stunT > 0) { e.stunT -= dt; }         // 晕眩：无法移动也无法攻击
    else if (e.paraT > 0) { e.paraT -= dt; }    // 麻痹：无法移动（被阻挡时的攻击不受影响）
    else if (e.atkPauseT > 0) { e.atkPauseT -= dt; } // 飞鸟：攻击定身中
    else if (!e.blockedBy) {
      const spd = e.base.speed * CELL * mods.enemySpeed * (onThorn ? 1 - THORN_SLOW : 1);   // 荆棘：所在格移速 -80%
      let rest = spd * dt;
      while (rest > 0 && !e.dead) {
        const tp = e.route[e.routeIdx];
        const dx = tp.x - e.x, dy = tp.y - e.y, d = Math.hypot(dx, dy);
        if (d <= rest) {
          e.x = tp.x; e.y = tp.y; rest -= d; e.routeIdx++;
          if (e.routeIdx >= e.route.length) {           // 抵达奶龙格
            e.dead = true; life--;
            fx.push({ type: "burst", x: e.x, y: e.y, ttl: 0.5, color: C.danger });
            if (life <= 0) { endBattle(false); return; }
          }
        } else { e.x += dx / d * rest; e.y += dy / d * rest; rest = 0; }
      }
      // 阻挡判定：当前所在格有未满阻挡的路线机关 → 停靠（飞行敌人仅能被 blockAir 机关阻挡）
      if (!e.dead) {
        const cc = Math.floor((e.x - GRID_OX) / CELL), cr = Math.floor((e.y - GRID_OY) / CELL);
        const t = trapAt(cc, cr);
        if (t && cellChar(cc, cr) === "#" && (!e.flying || t.base.blockAir) && t.blocked.length < trapBlockOf(t)) {
          e.blockedBy = t; t.blocked.push(e);
        }
      }
    }
  }

  /* ---- 机关：索敌 / 攻击 ---- */
  for (const t of traps) {
    if (t.dead) continue;
    if (t.flash > 0) t.flash -= dt;
    if (t.bonusT > 0) {                              // 靴子技能：产币中（冻结不影响被动产币）
      const dtb = Math.min(dt, t.bonusT);            // 按剩余时间比例产币，尾帧不超产
      t.bonusT -= dtb;
      if (t.bonusT < 1e-9) t.bonusT = 0;             // 吸附浮点残值（5 - 50×0.1 余 4e-16）
      coins = Math.min(COIN_MAX, coins + BOOT_COIN_RATE * dtb);
    }
    if (t.energizeT > 0) t.energizeT -= dt;          // 精力充沛：攻击 buff 计时（冻结不影响计时）
    if (t.burnT > 0) {                               // 灼烧（翼龙）：每秒 125 点真实伤害，无视防御，冻结也持续
      const dtb = Math.min(dt, t.burnT);
      t.burnT -= dtb;
      if (t.burnT < 1e-9) t.burnT = 0;
      hurtTrapTrue(t, BURN_DPS * dtb);
      if (t.dead) continue;
    }
    t.blocked = t.blocked.filter(e => !e.dead && e.blockedBy === t);
    if (t.base.regenBlock && t.blocked.length) {          // 守望屏障：每阻挡 1 名敌人，每秒恢复 3% 生命上限（冻结时也持续）
      t.hp = Math.min(t.hpMax, t.hp + t.hpMax * t.base.regenBlock * t.blocked.length * dt);
    }
    if (t.frzT > 0) { t.frzT -= dt; continue; }        // 冻结：无法行动（攻击/治疗/冷却全部暂停，阻挡仍有效）
    if (t.base.buff) continue;                          // 灯泡：不攻击，攻击力光环为被动效果（冻结时也持续生效，同荆棘）
    t.cd -= dt;
    if (t.base.heal) {                                 // 治疗机关：为 range 格内生命最低的受损友方机关回血
      if (t.cd <= 0) {
        let tgt = null;
        for (const o of traps) {
          if (o === t || o.dead || o.hp >= o.hpMax) continue;
          const d = Math.hypot(o.x - t.x, o.y - t.y);
          if (d <= t.base.range * CELL && (!tgt || o.hp < tgt.hp)) tgt = o;
        }
        if (tgt) {                                     // 没有可治疗的机关时不消耗冷却，持续待命
          t.cd = trapIntervalOf(t);
          tgt.hp = Math.min(tgt.hpMax, tgt.hp + Math.round(trapAtkOf(t) * (1 + mods.healUp)));   // 治疗量 = 攻击力 × (1+受治疗加成)
          if (chosen.includes("energize")) tgt.energizeT = ENERGIZE_TIME;   // 精力充沛：受注射剂治疗的机关 5 秒内攻击力 +200
          fx.push({ type: "heal", x1: t.x, y1: t.y, x2: tgt.x, y2: tgt.y, ttl: 0.35 });
        }
      }
      continue;
    }
    if (t.base.aoe) {                                  // 范围攻击：命中 range 格内所有敌人（含飞行）并附加麻痹
      if (t.cd <= 0) {
        let hitAny = false;
        const empower = chosen.includes("mana") && t.magicN >= 3 ? 1.25 : 0;   // 魔力爆发：每攻击3次后下一次 +125%
        for (const e of enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - t.x, e.y - t.y) > t.base.range * CELL) continue;
          hurtEnemy(e, trapDmgOf(t, e.def, empower));
          if (!e.dead) e.paraT = Math.max(e.paraT, PARA_TIME * (1 - resOf(e.base, "para")));   // 麻痹抗性按百分比缩短
          hitAny = true;
        }
        if (hitAny) {                                  // 范围内无敌时不耗冷却，持续待命
          t.cd = trapIntervalOf(t);
          t.magicN = empower ? 0 : t.magicN + 1;
          fx.push({ type: "nova", x: t.x, y: t.y, r: t.base.range * CELL, ttl: 0.3, color: empower ? "#ffd23f" : "#c9a0ff" });
        }
      }
      continue;
    }
    let target = t.blocked.find(e => !e.dead) || null;   // 优先打被自己阻挡的地面敌人
    if (!target && t.base.range > 0) {                   // 远程：射程内最近敌人（含飞行敌人）
      let bd = Infinity;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - t.x, e.y - t.y);
        if (d <= t.base.range * CELL && d < bd) { bd = d; target = e; }
      }
    }
    if (t.cd <= 0) {
      if (target) {
        const chargeExtra = t.base.id === "bow" ? BOW_CHARGE_MUL * (t.charge || 0) : 0;   // 弓箭蓄力：每层 +50% 攻击力
        t.cd = trapIntervalOf(t);
        hurtEnemy(target, trapDmgOf(t, target.def, chargeExtra));
        if (t.base.id === "bow") t.charge = 0;                               // 开火后蓄力层数清零
        fx.push({ type: "tracer", x1: t.x, y1: t.y, x2: target.x + target.jx, y2: target.y + target.jy, ttl: 0.09 });
        if (t.base.id === "pistol" && chosen.includes("deadeye") && Math.random() < 0.6) {   // 弹无虚发：60% 额外攻击一次（不再触发）
          let t2 = t.blocked.find(e => !e.dead) || null;
          if (!t2) {
            let bd = Infinity;
            for (const e of enemies) {
              if (e.dead) continue;
              const d = Math.hypot(e.x - t.x, e.y - t.y);
              if (d <= t.base.range * CELL && d < bd) { bd = d; t2 = e; }
            }
          }
          if (t2) {
            hurtEnemy(t2, trapDmgOf(t, t2.def));
            fx.push({ type: "tracer", x1: t.x, y1: t.y, x2: t2.x + t2.jx, y2: t2.y + t2.jy, ttl: 0.09 });
          }
        }
      } else if (t.base.id === "bow") {                   // 弓箭蓄力：范围内无敌人时，每过一个攻击间隔叠加 1 层（默认至多 2 层，百步穿杨 +1 → 3 层）
        t.charge = Math.min(bowChargeMax(), (t.charge || 0) + 1);
        t.cd = trapIntervalOf(t);
      }
    }
  }
  traps = traps.filter(t => !t.dead);
  enemies = enemies.filter(e => !e.dead);

  /* ---- 特效 ---- */
  for (const f of fx) f.ttl -= dt;
  fx = fx.filter(f => f.ttl > 0);

  /* ---- 升级 → 三选一战略 ---- */
  if (pendingStrats > 0) {
    const opts = drawStratOptions();
    if (opts.length) { stratOpts = opts; rerollUsed = false; state = ST.STRAT; }   // 每次进入三选一恢复刷新机会
    else pendingStrats = 0;
  }

  /* ---- 胜利判定：配置了总波次数时，全部放完且场上无敌 ---- */
  if (maxWaveNow() < Infinity && waveIdx >= maxWaveNow() && spawnQ.length === 0 && enemies.length === 0 && state === ST.PLAY) { endBattle(true); }
}

function canvasPos(t) {

    return {
      x: W / 2 + (cy - (r.top + r.height / 2)) * W / r.height,
      y: H / 2 - (cx - (r.left + r.width / 2)) * H / r.width

  }
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}

canvas.addEventListener("touchend", () => { labDragY = null; });
canvas.addEventListener("wheel", e => {                            // 桌面端滚轮滑动
  if (state === ST.LAB && labTab === "up") {
    e.preventDefault();
    labUpScroll = Math.max(0, Math.min(labUpMaxScroll(), labUpScroll + e.deltaY));
  } else if (state === ST.TASK) {
    e.preventDefault();
    taskScroll = Math.max(0, Math.min(taskMaxScroll(), taskScroll + e.deltaY));
  }
}, { passive: false });

addEventListener("keydown", e => {
  if (e.code === "Escape") {
    if (state === ST.PLAY) abortOpen = !abortOpen;                 // 战斗中 ESC：呼出/关闭中止确认
    else if (state === ST.LOADOUT || state === ST.WIN || state === ST.LOSE || state === ST.LAB || state === ST.TASK) state = ST.MENU;
  } else if (state === ST.PLAY) {
    if (abortOpen) return;                                         // 弹窗打开时屏蔽其他战斗按键
    if (e.code.startsWith("Digit")) {
      const i = +e.code.slice(5) - 1;
      if (i >= 0 && i < 6 && loadout[i]) { selTrap = selTrap === i ? -1 : i; demolishMode = false; }
    } else if (e.code === "KeyX") { demolishMode = !demolishMode; if (demolishMode) selTrap = -1; }
  }
});

/* ================= 绘制 ================= */
function drawBtn(b, label, bg, fg, fs) {
  px(b.x + 3, b.y + 3, b.w, b.h, "rgba(0,0,0,.35)");
  px(b.x, b.y, b.w, b.h, bg);
  px(b.x, b.y, b.w, 3, "rgba(255,255,255,.35)");
  px(b.x, b.y + b.h - 3, b.w, 3, "rgba(0,0,0,.25)");
  pixelText(label, b.x + b.w / 2, b.y + (b.h - fs) / 2 + 1, fs, fg, "center", false);
}
function drawTopBtn(b) {
  px(b.x + 2, b.y + 2, b.w, b.h, "rgba(0,0,0,.35)");
  px(b.x, b.y, b.w, b.h, "#554a7a");
  pixelText(b.label, b.x + b.w / 2, b.y + (b.h - (IS_TOUCH ? 16 : 12)) / 2 + 1, IS_TOUCH ? 16 : 12, "#e8e2ff", "center", false);
}
function drawPanel(x, y, w, h, bg = C.panel, edge = C.panelE) {   // bg/edge 可选：科技树节点等彩色面板用
  px(x + 4, y + 4, w, h, "rgba(0,0,0,.4)");
  px(x, y, w, h, bg);
  px(x, y, w, 3, edge);
  px(x, y + h - 3, w, 3, "rgba(0,0,0,.35)");
  px(x, y, 3, h, "rgba(255,255,255,.12)");
  px(x + w - 3, y, 3, h, "rgba(0,0,0,.35)");
}

/* ---- 战斗场景 ---- */
function drawField() {
  const g = CUR.g;
  // 格子
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = GRID_OX + c * CELL, y = GRID_OY + r * CELL, ch = g[r][c];
    if (ch === "#") {
      px(x, y, CELL, CELL, (r + c) % 2 ? C.pathD : C.path);
      px(x + 17, y + 17, 6, 6, "rgba(0,0,0,.12)");
    } else {
      px(x, y, CELL, CELL, (r + c) % 2 ? C.grassD : C.grass);
    }
  }
  // 路线方向箭头（所有支线去重后绘制）
  for (const s of CUR.arrowSegs) pixelText(s.ch, s.x, s.y - 8, 15, "rgba(255,255,255,.4)", "center", false);
  // 出生点：黑叉
  for (const sp of CUR.spawns) {
    const x = GRID_OX + sp.c * CELL, y = GRID_OY + sp.r * CELL;
    ctx.strokeStyle = "#161616"; ctx.lineWidth = 6; ctx.lineCap = "square";
    ctx.beginPath();
    ctx.moveTo(x + 9, y + 9); ctx.lineTo(x + CELL - 9, y + CELL - 9);
    ctx.moveTo(x + CELL - 9, y + 9); ctx.lineTo(x + 9, y + CELL - 9);
    ctx.stroke();
  }
  // 奶龙格：红底 + 奶龙立绘（待机/跑步慢切换）
  const fr = Math.floor(gameT * 2) % 2 ? NAILONG_RUNB : NAILONG_BODY;
  for (const h of CUR.homes) {
    const x = GRID_OX + h.c * CELL, y = GRID_OY + h.r * CELL;
    px(x + 1, y + 1, CELL - 2, CELL - 2, C.home);
    drawSprite(fr, x + 4, y + 4, 2, NAILONG_PAL);
  }
  // 网格边框
  ctx.strokeStyle = "#0d0a1f"; ctx.lineWidth = 3;
  ctx.strokeRect(GRID_OX - 1.5, GRID_OY - 1.5, COLS * CELL + 3, ROWS * CELL + 3);
}
function drawTrap(t) {
  const x = GRID_OX + t.c * CELL, y = GRID_OY + t.r * CELL;
  px(x + 1, y + 1, CELL - 2, CELL - 2, "#0d0a1f");          // 底座外框
  px(x + 3, y + 3, CELL - 6, CELL - 6, "#2a2350");          // 底座面板
  px(x + 3, y + 3, CELL - 6, 2, "#4a3a86");
  const sp = SPR[t.base.id];
  if (sp) {
    const off = (CELL - 16 * sp.scale) / 2;            // 贴图在格内居中
    drawSpriteXY(sp.body, x + off, y + off, sp.scale, sp.scale, t.flash > 0 ? sp.wpal : sp.pal);
  } else {
    px(x + 5, y + 5, CELL - 10, CELL - 10, t.flash > 0 ? "#ffffff" : (t.base.color || "#b8c4d0"));
    pixelText(t.base.name[0], x + CELL / 2, y + 10, 15, "#0d0a1f", "center", false);
  }
  // 灯泡光环指示：格周暖光晕 + 四角微光（提示上下左右相邻增益范围）
  if (t.base.buff) {
    ctx.globalAlpha = 0.10 + Math.sin(gameT * 4) * 0.04;
    px(x - CELL, y - CELL, CELL * 3, CELL * 3, "#ffe873");
    ctx.globalAlpha = 1;
    px(x - CELL, y, CELL, CELL, "rgba(255,232,115,.12)"); px(x + CELL, y, CELL, CELL, "rgba(255,232,115,.12)");
    px(x, y - CELL, CELL, CELL, "rgba(255,232,115,.12)"); px(x, y + CELL, CELL, CELL, "rgba(255,232,115,.12)");
  }
  // 阻挡数指示（路线上，含坚不可摧加成）
  if (trapBlockOf(t) > 0 && cellChar(t.c, t.r) === "#") {
    for (let i = 0; i < trapBlockOf(t); i++) {
      px(x + 5 + i * 8, y + CELL - 6, 6, 4, i < t.blocked.length ? "#e33b4e" : "rgba(255,255,255,.5)");
    }
  }
  // 血条（受损时）
  if (t.hp < t.hpMax) {
    px(x + 3, y - 4, CELL - 6, 4, "rgba(0,0,0,.5)");
    px(x + 3, y - 4, (CELL - 6) * Math.max(0, t.hp / t.hpMax), 4, "#7cff6b");
  }
  // 靴子技能指示：产币期间头顶跳动金币
  if (t.bonusT > 0) pixelText("◈", x + CELL / 2, y - 18 + Math.round(Math.sin(gameT * 6) * 2), 14, "#ffe873", "center", false);
  if (t.energizeT > 0) pixelText("▲", x + CELL / 2, y - 32 + Math.round(Math.sin(gameT * 8) * 2), 13, "#ffb14e", "center", false);   // 精力充沛：攻击 buff 指示
  // 弓箭蓄力指示：每层头顶一个金色 ◆，满层（默认 2、百步穿杨 3）时更亮
  if (t.base.id === "bow" && t.charge > 0) {
    const ch = t.charge || 0, cmax = bowChargeMax(), full = ch >= cmax;
    for (let i = 0; i < ch; i++) pixelText("◆", x + CELL / 2 - (ch - 1) * 5 + i * 10, y - 16 + Math.round(Math.sin(gameT * 6 + i) * 1.5), 11, full ? "#fff3c0" : "#ffd23f", "center", false);
  }
  // 冻结指示：冰蓝覆盖 + 白色冰晶十字
  if (t.frzT > 0) {
    ctx.globalAlpha = 0.45; px(x + 1, y + 1, CELL - 2, CELL - 2, "#9fe4ff"); ctx.globalAlpha = 1;
    px(x + CELL / 2 - 1, y + 7, 2, CELL - 14, "#e8fbff");
    px(x + 7, y + CELL / 2 - 1, CELL - 14, 2, "#e8fbff");
  }
  // 灼烧指示：橙红覆盖 + 格内窜动的火苗
  if (t.burnT > 0) {
    ctx.globalAlpha = 0.30; px(x + 1, y + 1, CELL - 2, CELL - 2, "#ff6a2a"); ctx.globalAlpha = 1;
    const fl = Math.floor(gameT * 10) % 2;
    px(x + 8, y + CELL - 16 - fl * 3, 5, 8 + fl * 3, "#ff8a3f");
    px(x + CELL - 14, y + CELL - 12 - (1 - fl) * 3, 5, 7 + (1 - fl) * 3, "#ffcf5a");
    px(x + 10, y + CELL - 10, 3, 5, "#ffe873");
  }
}
function drawEnemy(e) {
  const s = e.boss ? 1.8 : e.elite ? 1.3 : 1;      // 首领比精英更大一圈
  const x = e.x + e.jx, y = e.y + e.jy;
  const yUp = y - (e.flying ? AIR_LIFT : 0);
  const sp = SPR[e.base.id];
  const bodyW = sp ? 16 * sp.scale * s : 22 * s;                    // 贴图宽度（翅膀 / 血条定位用）
  if (e.flying && !e.boss) {                       // 飞行敌人：地面投影 + 扇动的翅膀（首领自带翼膜，不叠加）
    ctx.globalAlpha = 0.22; px(x - 10, y + 8, 20, 5, "#000"); ctx.globalAlpha = 1;
    const flap = Math.floor(gameT * 12) % 2 ? -5 : 0;
    px(x - bodyW / 2 - 8, yUp + flap, 9, 5, "#ffffff");
    px(x + bodyW / 2 - 1, yUp + flap, 9, 5, "#ffffff");
    px(x - bodyW / 2 - 6, yUp + flap + 4, 6, 3, "#cfe8ff");
    px(x + bodyW / 2, yUp + flap + 4, 6, 3, "#cfe8ff");
  }
  let topRef;
  if (sp) {
    // 果冻挤压：压扁时两侧鼓出（史莱姆的黏黏感），贴图底部贴在路面上
    const squash = 1 + Math.sin(gameT * 3.2 + e.jx * 0.7) * 0.09;
    const pw = sp.scale * s / squash, ph = sp.scale * s * squash;
    const w = 16 * pw, h = 16 * ph;
    if (!e.flying || e.boss) { ctx.globalAlpha = 0.18; px(x - 14, yUp + 12, 28, 5, "#000"); ctx.globalAlpha = 1; }
    drawSpriteXY(sp.body, x - w / 2, yUp + 16 - h, pw, ph, e.flash > 0 ? sp.wpal : sp.pal);
    topRef = yUp + 16 - h + ph;                                     // 精灵第 1 行（头顶）
  } else {
    const w = bodyW, h = 18 * s;
    px(x - w / 2 - 1, yUp - h / 2 - 1, w + 2, h + 2, e.elite ? "#ffd23f" : "#0d0a1f");   // 描边（精英为金框）
    px(x - w / 2, yUp - h / 2, w, h, e.flash > 0 ? "#ffffff" : (e.base.color || "#c060ff"));
    px(x - 5 * s, yUp - 3 * s, 3, 3, "#fff"); px(x + 2 * s, yUp - 3 * s, 3, 3, "#fff");
    px(x - 4 * s, yUp - 2 * s, 2, 2, "#161616"); px(x + 3 * s, yUp - 2 * s, 2, 2, "#161616");
    topRef = yUp - h / 2;
  }
  if (e.elite) {                                     // 精英标记：头顶小皇冠（首领为更大的暗金尖冠）
    const cr = e.boss ? "#ff8a3f" : "#ffd23f", cs = e.boss ? 1.4 : 1;
    const cw = Math.round(14 * cs), ch = Math.round(3 * cs), ct = Math.round(3 * cs);
    px(x - cw / 2, topRef - 5 * cs, cw, ch, cr);
    px(x - cw / 2, topRef - 5 * cs - ct, ct, ct, cr);
    px(x - ct / 2, topRef - 5 * cs - ct - (e.boss ? 2 : 0), ct, ct, cr);
    px(x + cw / 2 - ct, topRef - 5 * cs - ct, ct, ct, cr);
  }
  if (e.paraT > 0) {                                 // 麻痹标记：头顶闪烁的电光
    const tw = Math.floor(gameT * 8) % 2;
    px(x - 9, topRef - 18 - tw * 2, 4, 4, "#9fe4ff");
    px(x + 5, topRef - 20 + tw * 2, 4, 4, "#9fe4ff");
    px(x - 2, topRef - 24, 4, 4, "#e3ccff");
  }
  if (e.stunT > 0) {                                 // 晕眩标记：头顶环绕旋转的金星
    const rr = 9, a0 = gameT * 6;
    for (let i = 0; i < 3; i++) {
      const a = a0 + i * Math.PI * 2 / 3;
      px(x + Math.round(Math.cos(a) * rr) - 2, topRef - 20 + Math.round(Math.sin(a) * 3) - 2, 4, 4, i % 2 ? "#ffe873" : "#fff3c0");
    }
  }
  // 血条
  const bw = 28 * s, by = topRef - 12 - (e.boss ? 9 : 0);      // 首领皇冠更高，血条相应上移
  px(x - bw / 2, by, bw, 4, "rgba(0,0,0,.5)");
  px(x - bw / 2, by, bw * Math.max(0, e.hp / e.maxHp), 4, e.boss ? "#ff6a8a" : e.elite ? "#ffd23f" : "#ff6b6b");
}
function drawFx() {
  for (const f of fx) {
    if (f.type === "tracer") {
      ctx.globalAlpha = Math.min(1, f.ttl / 0.09);
      ctx.strokeStyle = "#ffe873"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === "heal") {
      ctx.globalAlpha = Math.max(0, f.ttl / 0.35);
      ctx.strokeStyle = "#7cff6b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      px(f.x2 - 6, f.y2 - 2, 12, 4, "#7cff6b");        // 目标处绿色十字
      px(f.x2 - 2, f.y2 - 6, 4, 12, "#7cff6b");
      ctx.globalAlpha = 1;
    } else if (f.type === "nova") {                  // 水晶球范围攻击：扩散冲击环（魔力爆发强化时为金色）
      const k = 1 - f.ttl / 0.3;
      ctx.globalAlpha = Math.max(0, f.ttl / 0.3) * 0.7;
      ctx.strokeStyle = f.color || "#c9a0ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === "boom") {                  // 炸弹爆破：中心火球爆闪 + 三层冲击环 + 飞散火星
      const k = 1 - f.ttl / 0.55, a = Math.max(0, f.ttl / 0.55);
      const fr = f.r * (0.3 + 0.55 * k);             // 中心火球（径向渐变，膨胀后消散）
      const g = ctx.createRadialGradient(f.x, f.y, fr * 0.12, f.x, f.y, fr);
      g.addColorStop(0, "#fff6c0"); g.addColorStop(0.4, "#ffd23f"); g.addColorStop(0.75, "#ff8c3a"); g.addColorStop(1, "rgba(255,90,40,0)");
      ctx.globalAlpha = a * 0.95;
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, fr, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a;
      ctx.strokeStyle = "#ff5a28"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ff8c3a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.25 + 0.75 * k) * 0.75, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.2 + 0.8 * k) * 0.5, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 12; i++) {                 // 12 向飞散火星（随时间缩小淡出）
        const an = i / 12 * Math.PI * 2 + 0.3, d = f.r * (0.35 + 0.9 * k), sz = Math.max(1, Math.round(5 * a));
        px(f.x + Math.cos(an) * d - sz / 2, f.y + Math.sin(an) * d - sz / 2, sz, sz, "#ffe873");
      }
      ctx.globalAlpha = 1;
    } else if (f.type === "burst") {
      const k = 1 - f.ttl / 0.5, n = 6;
      ctx.globalAlpha = Math.max(0, f.ttl / 0.5);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2, d = k * 26;
        px(f.x + Math.cos(a) * d - 2, f.y + Math.sin(a) * d - 2, 4, 4, f.color);
      }
      ctx.globalAlpha = 1;
    } else if (f.type === "slash") {              // 武士挥砍：前方半圆刀光弧（随时间膨胀淡出）
      const k = 1 - f.ttl / 0.25;
      ctx.globalAlpha = Math.max(0, f.ttl / 0.25) * 0.85;
      ctx.strokeStyle = "#ffe873"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + 0.6 * k), f.ang - Math.PI / 2, f.ang + Math.PI / 2); ctx.stroke();
      ctx.strokeStyle = "#fff6c0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.35 + 0.55 * k), f.ang - Math.PI / 2, f.ang + Math.PI / 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}
function drawHover() {
  const cell = cellFromPt(mouse);
  if (!cell) return;
  const x = GRID_OX + cell.c * CELL, y = GRID_OY + cell.r * CELL;

  else if (base) color = buildableCell(cell.c, cell.r) && coins >= base.cost ? "#7cff6b" : "#ff6b6b";
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3);
  if (base && !demolishMode && base.range > 0) {   // 射程预览
    ctx.globalAlpha = 0.1; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x + CELL / 2, y + CELL / 2, base.range * CELL, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(x + CELL / 2, y + CELL / 2, base.range * CELL, 0, Math.PI * 2); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 建造预览：半透明贴图
  const sp = base ? SPR[base.id] : null;
  if (sp && !demolishMode && !trapAt(cell.c, cell.r)) {
    const off = (CELL - 16 * sp.scale) / 2;
    ctx.globalAlpha = 0.42;
    drawSpriteXY(sp.body, x + off, y + off, sp.scale, sp.scale, sp.pal);
    ctx.globalAlpha = 1;
  }
}

/* ---- 大扭蛋机（抽卡页左侧）----
   动画时间轴：0~0.9s 摇柄翻滚 → 0.9~1.7s 扭蛋掉落弹跳 → 1.7~2.05s 落地颤抖 → 2.05~2.3s 爆开闪光 → 展示结果 */
const CAP_COLORS = ["#ff5b6e", "#ffd23f", "#4ac6ff", "#7cff6b", "#c9a0ff", "#ff9de2"];
const GASHA_CAPS = [];                    // 罩内胶囊固定分布（种子伪随机，避免每帧乱闪）
{ let s = 20260218;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 12; i++) GASHA_CAPS.push({ a: rnd() * Math.PI * 2, d: 0.2 + rnd() * 0.62, c: (rnd() * CAP_COLORS.length) | 0, ph: rnd() * Math.PI * 2 });
}
function fillDisc(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function drawCapsule(cx, cy, r, col) {   // 经典上下双色扭蛋
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#fff6e8"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI); ctx.fill();
  px(cx - r, cy - 1, r * 2, 2, "rgba(0,0,0,.2)");
  px(cx - r + 2, cy - r + 2, 3, 3, "rgba(255,255,255,.9)");
}
function drawGashapon() {                // 大扭蛋机
  const anim = gachaAnim, at = anim ? anim.t : 0;
  const mw = 172, mh = 212;
  const cranking = anim && at < 0.9;                                   // 阶段A：摇柄
  const mx = W / 2 - 262 + (cranking ? Math.sin(at * 36) * 2.5 : 0);   // 摇动时机身左右轻晃
  const my = 190 + (cranking ? Math.abs(Math.cos(at * 36)) * 1.5 : 0);
  const cx = mx + mw / 2, domeY = my + 54, domeR = 52;

  px(cx - 66, my + mh, 132, 5, "rgba(0,0,0,.35)");                     // 地面投影
  // 顶部招牌 + 闪烁十字星
  px(cx - 36, my - 28, 72, 22, "#4a3a86"); px(cx - 36, my - 28, 72, 3, "#6f5fd0");
  pixelText("扭 蛋", cx, my - 24, 13, "#ffd23f", "center", false);
  px(cx - 14, my - 7, 4, 8, "#c22f43"); px(cx + 10, my - 7, 4, 8, "#c22f43");
  if (Math.sin(menuT * 4) > 0.2) { px(cx + 46, my - 40, 4, 14, "#ffd23f"); px(cx + 41, my - 35, 14, 4, "#ffd23f"); }

  // 机身（糖果红 + 金色饰带）
  px(mx, my + 96, mw, mh - 96, "#e84a5f");
  px(mx + 6, my + 96, mw - 12, 6, "#ff8a96");
  px(mx, my + 96, 6, mh - 96, "#ff6a78"); px(mx + mw - 6, my + 96, 6, mh - 96, "#b52438");
  px(mx, my + mh - 14, mw, 14, "#c22f43");
  px(mx + 12, my + mh - 8, 24, 8, "#3a2b5e"); px(mx + mw - 36, my + mh - 8, 24, 8, "#3a2b5e");
  px(mx + 10, my + 158, mw - 20, 5, "#ffd23f");
  // 投币口
  px(mx + 14, my + 108, 12, 24, "#3a2b5e"); px(mx + 17, my + 113, 6, 3, "#ffd23f");
  pixelText("◈", mx + 20, my + 121, 9, "#ffd23f", "center", false);

  // 玻璃罩
  fillDisc(cx, domeY, domeR + 3, "rgba(0,0,0,.35)");
  fillDisc(cx, domeY, domeR, "rgba(143,211,255,.3)");
  ctx.strokeStyle = "#bfe8ff"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, domeY, domeR, 0, Math.PI * 2); ctx.stroke();
  // 罩内胶囊：待机微浮动 / 摇动时翻滚
  for (const cp of GASHA_CAPS) {
    let pxl, pyl;
    if (cranking) {
      const aa = cp.a + at * 9;
      pxl = cx + Math.cos(aa) * domeR * cp.d; pyl = domeY + Math.sin(aa) * domeR * cp.d * 0.8 + Math.sin(at * 30 + cp.ph) * 3;
    } else {
      pxl = cx + Math.cos(cp.a) * domeR * cp.d; pyl = domeY + Math.sin(cp.a) * domeR * cp.d * 0.8 + Math.sin(menuT * 1.6 + cp.ph) * 2.5;
    }
    drawCapsule(pxl, pyl, 8, CAP_COLORS[cp.c]);
  }
  px(cx - 30, domeY - 34, 22, 5, "rgba(255,255,255,.45)");             // 罩面高光

  // 摇柄旋钮（动画时旋转）
  fillDisc(cx, my + 130, 18, "#7a1030");
  fillDisc(cx, my + 130, 14, "#ff9de2");
  ctx.save(); ctx.translate(cx, my + 130); ctx.rotate(cranking ? at * 14 : Math.sin(menuT * 0.8) * 0.18);
  px(-3, -28, 6, 16, "#ffd23f"); fillDisc(0, -28, 6, "#ff5b6e");
  ctx.restore();
  fillDisc(cx, my + 130, 5, "#fff0c6");

  // 出蛋口
  px(cx - 28, my + 172, 56, 24, "#241b47");
  px(cx - 28, my + 172, 56, 3, "#4a3a86");
  px(cx - 20, my + 194, 40, 3, "#161030");

  // —— 扭蛋动画（掉落 / 颤抖 / 爆开）——
  if (anim && at >= 0.9) {
    const chuteY = my + 186, groundY = my + mh + 2;
    let gx = cx, gy = groundY - 11;
    if (at < 1.7) {                                                    // 掉落 + 两段弹跳
      const p = at - 0.9;
      if (p < 0.3) gy = chuteY + (groundY - 11 - chuteY) * (p / 0.3) * (p / 0.3);
      else { const b = (p - 0.3) / 0.8; gy = groundY - 11 - Math.abs(Math.sin(b * Math.PI * 2.2)) * 15 * (1 - b); gx = cx + Math.sin(p * 9) * 2; }
    } else if (at < 2.05) {                                            // 落地后越抖越烈
      const s2 = (at - 1.7) / 0.35;
      gx = cx + (Math.random() * 2 - 1) * (1 + s2 * 4); gy = groundY - 11 + (Math.random() * 2 - 1) * (0.5 + s2 * 1.5);
    } else {                                                           // 爆开：闪光 + 六向星芒
      const k = (at - 2.05) / 0.25;
      ctx.globalAlpha = 1 - k;
      fillDisc(cx, groundY - 11, 12 + k * 30, "#fff6e8");
      ctx.fillStyle = "#ffe873";
      for (let i = 0; i < 6; i++) {
        ctx.save(); ctx.translate(cx, groundY - 11); ctx.rotate(i * Math.PI / 3 + 0.5);
        ctx.fillRect(14 + k * 26, -2, 12 * (1 - k) + 4, 4); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    if (at < 2.05) drawCapsule(gx, gy, 11, "#ff5b6e");
    const msg = at < 0.9 ? "咕噜咕噜…" : at < 1.7 ? "叮咚！" : at < 2.05 ? "……" : "✦！";
    pixelText(msg, cx, my - 46 + Math.sin(menuT * 8) * 2, 14, "#ffe873", "center", false);
  }
}

  pixelText("点击任意处关闭", W / 2, y0 + ph - 34, 12, "#8f83c0", "center", false);
}
function drawLab() {
  px(0, 0, W, H, "#171130");
  drawTopBtn(BTN_LAB_BACK);
  pixelText("研发基地", W / 2, 14, 26, "#ffd23f", "center");
  drawLabCurrency();
  drawBtn(BTN_TAB_UP, "机关强化", labTab === "up" ? C.btn : "#554a7a", labTab === "up" ? C.btnText : "#e8e2ff", 17);
  drawBtn(BTN_TAB_GA, "机关扭蛋", labTab === "gacha" ? C.btn : "#554a7a", labTab === "gacha" ? C.btnText : "#e8e2ff", 17);
  drawBtn(BTN_TAB_TECH, "研发进度", labTab === "tech" ? C.btn : "#554a7a", labTab === "tech" ? C.btnText : "#e8e2ff", 17);
  if (labTab === "up") drawLabUp(); else if (labTab === "tech") drawLabTech(); else drawLabGacha();
  if (hintT > 0) pixelText(hintMsg, W / 2, H - 30, 14, "#ff9aa9", "center");
  if (labResult) drawGachaResult();
}

function render() {
  const sa = shakeT > 0 ? shakeT / 0.4 : 0;                          // 震动强度随剩余时间衰减
  ctx.save();
  if (sa > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * 7 * sa), Math.round((Math.random() * 2 - 1) * 7 * sa));
  if (state === ST.MENU) drawMenu();
  else if (state === ST.LOADOUT) drawLoadout();
  else if (state === ST.PLAY) drawPlay();
  else if (state === ST.STRAT) drawStrat();
  else if (state === ST.LAB) drawLab();
  else if (state === ST.TASK) drawTask();
  else if (state === ST.WIN) drawEnd(true);
  else if (state === ST.LOSE) drawEnd(false);
  else if (state === ST.NM_LOBBY) drawNmLobby();
  else if (state === ST.NM_MID) drawNmMid();
  else if (state === ST.NM_END) drawNmEnd();
  ctx.restore();                                           // 结束屏幕震动偏移（UI 弹窗不参与震动）
  if (packOpen) drawPack();                  // 新手礼包面板（赠送弹窗之下、其他界面之上）
  if (poolOpen) drawPool();                  // 卡池详情面板
  if (exchOpen) drawExch();                  // 圣眷珍材兑换面板
  if (giftPop) drawGiftPop();              // 赠送弹窗覆盖在最上层
}
/* ---- 科技树页：节点图（绘制与点击共用 techRect） ---- */
const TECH_NODE_W = 168, TECH_NODE_H = 80;
const techRect = n => ({ x: n.x - TECH_NODE_W / 2, y: n.y - TECH_NODE_H / 2, w: TECH_NODE_W, h: TECH_NODE_H });
const BTN_TECH_EXCHANGE = { x: W - 286, y: 602, w: 270, h: 34 };   // 全部点亮后：灵感兑换奶石（右下角）
function drawLabTech() {            // 科技树页：并入研发所作为第三个标签页（内容区，不含标题与返回）
  pixelText(`灵感 ×${lab.inspire}`, W / 2, 104, 16, "#c9a6ff", "center");
  /* 连线：前置节点 → 子节点（已点亮连线高亮） */
  for (const n of TECH_NODES) {
    if (!n.req) continue;
    const p = techNode(n.req), litLine = techLit(n.id);
    ctx.strokeStyle = litLine ? "#7cff6b" : "#3a3355"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y + TECH_NODE_H / 2); ctx.lineTo(n.x, n.y - TECH_NODE_H / 2); ctx.stroke();
  }
  /* 节点卡 */
  for (const n of TECH_NODES) {
    const r = techRect(n), lit = techLit(n.id), avail = !lit && (!n.req || techLit(n.req));
    const bg = lit ? (n.key ? "#7a5a10" : "#14520e") : avail ? "#2a2450" : "#1c1836";
    drawPanel(r.x, r.y, r.w, r.h, bg, lit ? (n.key ? "#ffd23f" : "#7cff6b") : "#554a7a");
    if (n.key) pixelText("★ 关键", r.x + r.w / 2, r.y + 4, 10, lit ? "#ffd23f" : "#8f83c0", "center", false);
    pixelText(n.name, r.x + r.w / 2, r.y + (n.key ? 19 : 10), 15, lit ? "#fff" : "#bdb2e8", "center", false);
    pixelText(n.desc, r.x + r.w / 2, r.y + (n.key ? 40 : 33), 10, lit ? "#dfffd0" : "#8f83c0", "center", false);
    pixelText(lit ? "已点亮（点击熄灭）" : `灵感 ×${techCost(n)}`,
      r.x + r.w / 2, r.y + r.h - 21, 11, lit ? "#7cff6b" : lab.inspire >= techCost(n) ? "#ffd23f" : "#ff6b6b", "center", false);
  }
  pixelText("点击节点点亮 / 熄灭（点亮需先点亮前置节点，熄灭返还灵感）", W / 2, 622, 12, "#8f83c0", "center", false);
  if (techAllLit()) {              // 全部点亮后：多余灵感可兑换奶石
    const can = lab.inspire >= 1;
    drawBtn(BTN_TECH_EXCHANGE, `灵感 ×1 → 奶石 ×${TECH_EXCHANGE_STONE}`,
      can ? "#ffc7e6" : "#3a3355", can ? "#5a1a3a" : "#6f5fa8", 14);
  }
}
/* ---- 任务页：每日任务 / 活动任务 / 新手任务（已领取自动移除，活动限时 14 天 ---- */
function drawTaskRow(rw, r) {
  drawPanel(r.x, r.y, r.w, r.h);
  pixelText(rw.name, r.x + 16, r.y + 7, 14, "#fff", "left", false);
  pixelText(`进度 ${rw.prog}/${rw.need}`, r.x + 16, r.y + 27, 11, "#8f83c0", "left", false);
  /* 奖励：放在按钮左侧，不与按钮重叠（按钮宽 112，左侧留 120 给奖励） */
  const rewardX = r.x + r.w - 248;
  if (rw.reward.type === "trap") {
    const t = TRAPS.find(x => x.id === rw.reward.id);
    drawEntityIcon(rw.reward.id, rewardX, r.y + 12, 24);
    pixelText(t ? t.name : "机关", rewardX + 30, r.y + 17, 12, "#ffd23f", "left", false);
  } else {
    pixelText(`奶石×${rw.reward.n}`, rewardX + 30, r.y + 17, 12, "#ffc7e6", "left", false);
  }
  const isDone = rw.st === 2;
  drawBtn(taskBtnRect(r), isDone ? "已领取" : rw.st === 1 ? "领取" : "未达成",
    isDone ? "#3a3355" : rw.st === 1 ? C.btn : "#554a7a",
    isDone ? "#6f5fa8" : rw.st === 1 ? C.btnText : "#8f83c0", 14);
}
function drawTask() {
  evInit();
  px(0, 0, W, H, "#171130");
  drawTopBtn(BTN_LAB_BACK);
  pixelText("任务", W / 2, 14, 26, "#ffd23f", "center");
  drawLabCurrency();
  taskScroll = Math.max(0, Math.min(taskMaxScroll(), taskScroll));
  const { rows, rects, titles } = taskRowRects();
  /* 内容区裁剪 + 滚动 */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, TASK_VIEW_Y, W, H - TASK_VIEW_Y - 10); ctx.clip();
  ctx.translate(0, -taskScroll);
  for (const t of titles) {
    const kind = rows[t.i].kind;
    let title, color = "#9fd8ff";
    if (kind === "daily") title = "每日任务（每日刷新，可重复领取）";
    else if (kind === "event") {
      const left = evActive() ? EV_DAY_LEFT() : 0;
      title = `活动任务（限时 ${EV_DAYS} 天，剩余 ${left} 天）`; color = "#ffd23f";
    } else title = "新手任务（仅可领取一次）";
    pixelText(title, W / 2 - 360, t.y + 5, 15, color, "left", false);
  }
  for (let i = 0; i < rects.length; i++) drawTaskRow(rects[i].row, rects[i]);
  ctx.restore();
  /* 滚动条 */
  const ms = taskMaxScroll();
  if (ms > 0) {
    const vh = H - TASK_VIEW_Y - 10, sh = Math.max(40, vh * vh / (vh + ms));
    px(W - 8, TASK_VIEW_Y + (vh - sh) * taskScroll / ms, 5, sh, "rgba(255,255,255,.35)");
  }
  if (hintT > 0) pixelText(hintMsg, W / 2, H - 10, 14, "#ff9aa9", "center");
}
function drawGiftPop() {        // 首次赠送奶石弹窗（点击任意处收下）
  ctx.globalAlpha = 0.78; px(0, 0, W, H, "#0d0a1f"); ctx.globalAlpha = 1;
  const pw = 460, ph = 280, x0 = (W - pw) / 2, y0 = (H - ph) / 2;
  drawPanel(x0, y0, pw, ph);
  const bx = W / 2 - 24, by = y0 + 44;                          // 像素礼盒
  px(bx, by + 12, 48, 36, "#c0455e"); px(bx - 3, by, 54, 14, "#e05a7a");
  px(bx + 21, by - 4, 6, 52, "#ffe873");
  px(bx + 11, by - 10, 10, 8, "#ffe873"); px(bx + 27, by - 10, 10, 8, "#ffe873");
  pixelText(giftPop.title, W / 2, y0 + 130, 22, "#ffd23f", "center", true);
  pixelText(`奶石 +${giftPop.amount}`, W / 2, y0 + 170, 28, "#ffc7e6", "center", true);
  pixelText(giftPop.sub, W / 2, y0 + 204, 13, "#9fd8ff", "center", false);
  pixelText("点击任意处收下", W / 2, y0 + ph - 26, 12, "#8f83c0", "center", false);
}

/* ---- 新手礼包面板：任选一款卡池限定机关 ---- */
function drawPack() {
  ctx.globalAlpha = 0.78; px(0, 0, W, H, "#0d0a1f"); ctx.globalAlpha = 1;
  const pw = packPanelW();
  drawPanel((W - pw) / 2, PACK_PANEL_Y, pw, 380);
  const y0 = PACK_PANEL_Y;
  pixelText("新手礼包", W / 2, y0 + 40, 26, "#ffd23f", "center", true);
  pixelText("任选一款卡池限定机关，领取后本礼包入口消失", W / 2, y0 + 72, 13, "#8f83c0", "center", false);
  for (const r of packCardRects()) {
    const t = r.t, sel = packSel === r.i, owned = lab.owned[t.id];
    px(r.x, r.y, r.w, r.h, sel ? "#4a3a86" : "#221a44");
    px(r.x, r.y, r.w, 2, sel ? "#ffd23f" : "#4a3a86");
    px(r.x, r.y + r.h - 2, r.w, 2, sel ? "#ffd23f" : "#4a3a86");
    px(r.x, r.y, 2, r.h, sel ? "#ffd23f" : "#4a3a86");
    px(r.x + r.w - 2, r.y, 2, r.h, sel ? "#ffd23f" : "#4a3a86");
    drawEntityIcon(t.id, r.x + r.w / 2 - 24, r.y + 14, 48);
    pixelText(t.name, r.x + r.w / 2, r.y + 84, 20, "#ffd23f", "center", true);
    pixelText("卡池限定", r.x + r.w / 2, r.y + 106, 11, "#c9a0ff", "center", false);
    pixelText(`攻${t.atk} 血${t.hp} 费${t.cost}`, r.x + r.w / 2, r.y + 130, 13, "#cfe8ff", "center", false);
    pixelText(`阻挡${t.block} ${t.thorns ? "光环" : t.range > 0 ? (t.aoe ? "范围" + t.range : "射程" + t.range) : "近战"}`,
      r.x + r.w / 2, r.y + 150, 12, "#9fd8ff", "center", false);
    pixelText(owned ? `已拥有 · 重复转材料×${DUP_TO_MAT}` : (sel ? "已选中 ✓" : "点击选择"),
      r.x + r.w / 2, r.y + 176, 11, owned ? "#ff9aa9" : sel ? "#7cff6b" : "#6f5fa8", "center", false);
  }
  drawBtn(BTN_PACK_OK, "领取", packSel >= 0 ? "#7cff6b" : "#3a2f66", packSel >= 0 ? "#0e3a1a" : "#6f5fa8", 17);
  drawBtn(BTN_PACK_NO, "暂不", "#ff9aa9", "#5a1020", 17);
}

/* ================= 移动端画布适配（与跑酷/蛋糕同方案） =================
   纯 CSS 视口单位在微信等内置浏览器里不可靠，用 JS 读 innerWidth/innerHeight 精确计算；
   竖屏时把 #wrap 旋转 90° 模拟横屏，让画布尽量铺满整屏。 */
let wrapRotated = false;
function layoutWrap(w, h, touch) {
  const wrap = document.getElementById("wrap");
  if (!touch) { wrap.style.width = ""; wrap.style.transform = ""; wrapRotated = false; return; }
  wrapRotated = h > w;
  const cw = wrapRotated ? Math.min(w * 16 / 9, h) : Math.min(w, h * 16 / 9);
  wrap.style.width = Math.round(cw) + "px";
  wrap.style.transform = wrapRotated ? "rotate(90deg)" : "none";
}
function fitWrap() { layoutWrap(innerWidth, innerHeight, IS_TOUCH); }
addEventListener("resize", fitWrap);
addEventListener("orientationchange", fitWrap);
fitWrap();

/* ================= 主循环 ================= */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  menuT += dt;
  if (state === ST.PLAY && !abortOpen) update(dt);     // 中止确认弹窗打开时战斗暂停
  else if (gachaAnim) {                                                              // 扭蛋机动画推进（含阶段音效）
    const prev = gachaAnim.t; gachaAnim.t += dt;
    if (gachaAnim.t < 0.9 && ((prev / 0.12) | 0) !== ((gachaAnim.t / 0.12) | 0)) tone(660 + ((gachaAnim.t * 220) | 0), 0, 0.04, "square", 0.05);   // 摇柄咔哒声（音调渐升）
    if (prev < 0.9 && gachaAnim.t >= 0.9) tone(392, 0, 0.1, "square", 0.07);          // 扭蛋落地声
    if (prev < 2.05 && gachaAnim.t >= 2.05) tone(1568, 0, 0.18, "square", 0.09);      // 爆开声
    if (gachaAnim.t >= 2.3) finishGacha();
  }
  else if (hintT > 0) hintT -= dt;          // 非战斗界面的提示也要消退
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
